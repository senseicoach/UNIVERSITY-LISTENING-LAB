fferences in certain communication practices, consumer preferences, or workplace expectations. Then support that claim with evidence."],["S","What else should we compare?"],["P","Consider regulation, market structure, consumer behaviour, labour costs, competition, taxation, logistics, or other factors relevant to your industry."],["S","Do we have to decide which country is better for the business?"],["P","No. \"Better\" is usually too vague. Instead, explain which environment creates particular advantages or disadvantages for the company and under what circumstances."],["S","So if Brazil is better for one part of the business and Canada is better for another, that's okay?"],["P","More than okay. That may be the most accurate conclusion."],["S","And we shouldn't assume that one explanation works for everything."],["P","Correct. Good international business analysis is usually more complicated than a simple country-versus-country comparison."]],"words":213,"kind":"dialogue"},{"num":37,"title":"Entrepreneurship Proposal","lines":[["P","For your entrepreneurship project, you'll prepare a proposal for a new business. The proposal should begin with a problem, not simply an idea."],["S","What do you mean by that?"],["P","Suppose you say, \"I want to create an app for university students.\" That's an idea. Now ask: What problem does the app solve? Who has that problem? How frequently do they experience it? And would they actually pay for a solution?"],["S","Do we have to interview potential customers?"],["P","I strongly recommend it. You don't need hundreds of interviews. Even a small number can reveal assumptions you didn't realize you were making."],["S","What if the people we interview don't like the idea?"],["P","Then you have learned something important. Don't hide negative responses from me. Explain what they told you and how that affected your thinking."],["S","What about competitors?"],["P","You must address them. If another company already solves the same problem successfully, explain why customers would choose your product instead."],["S","Can we say our product will be the best?"],["P","You can claim that if you have evidence, but \"best\" is difficult to establish. Be precise. Perhaps your product is cheaper, faster, easier to use, or designed for a specific group."],["S","What are you looking for most?"],["P","Evidence that you've tested your assumptions. Entrepreneurship involves uncertainty. I'm not expecting you to know whether the business will succeed. I'm expecting you to demonstrate that you've thought seriously about why it might or might not."]],"words":239,"kind":"dialogue"},{"num":38,"title":"Economics Research Paper","lines":[["P","Your final assignment in this section is an economics research paper. You'll choose a current economic issue and analyze it using economic concepts and evidence."],["S","Could I write about inflation?"],["P","Yes, but \"inflation\" is far too broad. You need a specific question."],["S","Maybe, \"Why has inflation increased?\""],["P","Still too broad. Increased where? During what period? And what aspect of inflation are you interested in?"],["S","What about, \"What factors contributed to inflation in Canada between 2021 and 2024?\""],["P","That's much more manageable. You can then decide which factors deserve the most attention."],["S","Do we have to use economic theory?"],["P","Yes. Theory gives you a framework for interpreting the evidence. But don't simply define a theory and then move on. Explain how it helps you understand your research question."],["S","What if the evidence suggests that several factors contributed?"],["P","That's likely. Be careful about claiming that one factor caused inflation unless your evidence supports a causal relationship."],["S","So I shouldn't say, \"Higher wages caused inflation,\" just because wages and inflation increased during the same period?"],["P","Correct. You would need stronger evidence. There could be other explanations, including supply constraints, changes in demand, monetary policy, or international factors."],["S","What should the conclusion do?"],["P","Answer your research question based on the evidence you've examined. You can say that several factors appear to have contributed and explain which ones the evidence supports most strongly. Precision is more important than certainty."]],"words":234,"kind":"dialogue"}]},{"part":4,"title":"Computer Science & Technology","scripts":[{"num":39,"title":"Programming Project","lines":[["P","For your next assignment, you'll be developing a small software application. The purpose of the project is not simply to produce something that works. I want you to demonstrate that you understand the programming decisions you're making."],["S","Does the program have to be completely original?"],["P","You may use standard libraries and techniques we've discussed in class. You may also consult documentation and other legitimate learning resources. However, you need to understand the code you submit."],["S","What happens if we find some code online that does exactly what we need?"],["P","You need to check the assignment rules before using it. More importantly, don't paste code into your project that you can't explain. If you use an external resource where required, acknowledge it appropriately."],["S","How will the project be graded?"],["P","There are four major components: functionality, code organization, documentation, and testing. Functionality is important, but a program that happens to work while being extremely difficult to understand isn't a strong submission."],["S","How much testing do you expect?"],["P","More than simply running the program once. Think about normal inputs, unusual inputs, and incorrect inputs. What happens if the user enters nothing? What happens if the value is outside the expected range?"],["S","Do we need to test everything before the final deadline?"],["P","No. In fact, I recommend that you don't wait. Test each part as you develop it. Finding a problem in a small section of code is much easier than finding ten problems the night before the deadline."],["S","So the development process is part of the assignment too?"],["P","Exactly. Good programming isn't just about the final result. It's about how you get there."]],"words":270,"kind":"dialogue"},{"num":40,"title":"Explaining Your Code","lines":[["P","Today we're going to talk about something that many students overlook: explaining your code. For this assignment, I'll ask you to explain several important decisions you made in your program."],["S","Do you mean we have to explain every line?"],["P","No. If you explain every line, we'll be here all day. I want you to explain the important decisions."],["S","Such as why we used a particular data structure?"],["P","Exactly. Suppose you used a dictionary instead of a list. Tell me why. Perhaps you needed to retrieve information quickly using a key. If you made that choice simply because you saw it in an example, I want you to think about whether it was actually appropriate."],["S","What if there were several ways to solve the problem?"],["P","That's normal. Programming rarely gives you only one possible solution. A strong explanation recognizes alternatives."],["S","Should we say that our solution is the best one?"],["P","Only if you can support that claim. You might instead say, \"We chose this approach because it was simpler to implement and was sufficient for the size of our dataset.\""],["S","What if there's a better solution that we didn't know about?"],["P","Then you can mention it. Recognizing a limitation doesn't automatically make your project weak. In fact, it can demonstrate that you understand the problem."],["S","So you're testing whether we understand the reasoning behind the code, not just whether we can write it."],["P","Precisely. Anyone evaluating your work should be able to see that you made deliberate technical decisions."]],"words":248,"kind":"dialogue"},{"num":41,"title":"Data Analysis","lines":[["P","Your next assignment involves analyzing a dataset. Before you start calculating averages or producing graphs, I want you to understand the data you're working with."],["S","What should we look at first?"],["P","Start with the variables. What exactly does each variable measure? How was it collected? What population does the sample represent?"],["S","Can we remove unusual values?"],["P","Not automatically. An unusual value may be an error, but it may also represent a real observation. Before removing anything, investigate why it appears unusual."],["S","What about missing data?"],["P","You need to report it and decide how you're going to handle it. Don't simply delete every incomplete record without considering the consequences."],["S","If we find a strong relationship between two variables, can we say one caused the other?"],["P","No. A relationship between variables is not, by itself, evidence of causation. You need to consider alternative explanations and the design of the study."],["S","What should we put in the conclusion?"],["P","State what the analysis actually shows. If the evidence supports an association, say association. Don't use stronger language simply because it sounds more impressive."],["S","Does statistical significance mean the result is important?"],["P","Not necessarily. A statistically significant difference can be very small in practical terms. You need to consider both statistical and practical significance."],["S","So we're being graded on how we interpret the numbers, not just whether we calculate them correctly."],["P","Exactly. Data analysis is interpretation as well as calculation."]],"words":235,"kind":"dialogue"},{"num":42,"title":"Cybersecurity Research Paper","lines":[["P","For your cybersecurity research paper, you'll investigate a specific security problem and evaluate possible approaches to addressing it."],["S","Can I write about cybersecurity in general?"],["P","No. That's much too broad. Choose a specific problem, technology, threat, or security practice."],["S","What about phishing attacks?"],["P","That could work, but you'll still need to narrow it. For example, you might investigate why phishing remains effective despite increased employee training."],["S","Can I use cybersecurity company websites as sources?"],["P","You can use them, but consider why the company published the information. A security company may have valuable technical knowledge, but it may also have a commercial interest in presenting a particular problem or solution."],["S","So a company source isn't automatically unreliable?"],["P","Correct. Evaluate the source rather than labeling it simply \"good\" or \"bad.\""],["S","What should our paper recommend?"],["P","That depends on your research question. You may recommend a particular approach, compare several approaches, or conclude that the evidence doesn't clearly support one solution."],["S","Do we have to explain the technical details?"],["P","Yes, but explain them at the level appropriate for your audience. Don't demonstrate your knowledge by making the paper unnecessarily difficult to understand."],["S","What would make the paper analytical rather than descriptive?"],["P","Don't simply explain what phishing is. Compare the evidence, examine why particular defenses succeed or fail, consider limitations, and reach a conclusion that follows from your analysis."]],"words":225,"kind":"dialogue"},{"num":43,"title":"Artificial Intelligence Ethics Presentation","lines":[["P","Your presentation this week concerns an ethical issue involving artificial intelligence. Each group will choose one application of AI and examine a specific ethical question."],["S","Can we argue that AI is good or bad?"],["P","You can develop an argument, but avoid starting with an absolute position. I want you to investigate the evidence first."],["S","For example, we could talk about AI in hiring."],["P","Yes. You might examine whether automated hiring systems can reproduce existing biases."],["S","Would we need to argue that they are biased?"],["P","Only if your evidence supports that conclusion. You should also consider evidence showing situations in which automated systems may reduce certain forms of human bias."],["S","So we have to present both sides?"],["P","You should engage seriously with relevant counterarguments. That doesn't mean pretending every claim has equal evidence behind it."],["S","What about ethical opinions? They're difficult to prove."],["P","Exactly. Distinguish factual claims from value judgments. \"This system rejected twelve percent more applicants from group A\" is a factual claim that requires evidence. \"That outcome is unfair\" is an ethical judgment that requires an argument about what fairness means."],["S","How should we handle uncertainty?"],["P","Directly. If researchers disagree or the technology is changing rapidly, tell your audience. Don't pretend that a complicated issue has a simple answer just because you're giving a ten-minute presentation."],["S","And we should explain our own conclusion?"],["P","Yes. But your conclusion should emerge from the evidence and reasoning you've presented."]],"words":237,"kind":"dialogue"},{"num":44,"title":"Experimental Results: When the Results Don't Match the Hypothesis","lines":[["P","Today we're discussing what happens when an experiment doesn't produce the result you expected."],["S","What if our hypothesis was wrong?"],["P","Then your hypothesis may have been wrong. That's not necessarily a problem."],["S","But won't we lose marks?"],["P","Not simply because the result was unexpected. I'm interested in whether you conducted the experiment properly and interpreted the result honestly."],["S","Suppose our hypothesis predicted that increasing temperature would increase the reaction rate, but the reaction became slower."],["P","Then don't rewrite your hypothesis after the experiment so that it matches the result. Report what happened."],["S","Should we say there was experimental error?"],["P","Only if you have a reason to think so. \"Experimental error\" is not an explanation by itself. Ask what might have gone wrong. Was the temperature measured accurately? Was the sample contaminated? Was the procedure followed consistently?"],["S","What if we can't determine the reason?"],["P","Then say that. You can identify plausible explanations without claiming that you know which one is responsible."],["S","Should we still discuss our original hypothesis?"],["P","Absolutely. Explain whether the results supported it, failed to support it, or produced evidence that was inconclusive."],["S","So an unexpected result can actually make the discussion more interesting."],["P","It often does. Science advances partly because people investigate results they didn't expect."]],"words":208,"kind":"dialogue"},{"num":45,"title":"Machine Learning Project","lines":[["P","For your machine learning project, you'll train a model using the dataset provided in the course. Your report should explain not only how well the model performed but also what that performance actually means."],["S","If our model has ninety-five percent accuracy, is that good?"],["P","You can't answer that from accuracy alone. First, consider what you're predicting and how the classes are distributed."],["S","You mean if ninety-five percent of the examples belong to one class?"],["P","Exactly. Imagine that ninety-five percent of your data belongs to one category. A model that always predicts that category could achieve ninety-five percent accuracy while providing very little useful information."],["S","So we should look at other measures?"],["P","Yes. Depending on the problem, you may need precision, recall, F1 score, a confusion matrix, or other appropriate measures."],["S","Do we have to compare different models?"],["P","I expect you to compare at least two reasonable approaches. Explain why one performed differently from the other."],["S","What if the more complicated model performs only slightly better?"],["P","Then discuss whether the additional complexity is justified. More complicated isn't automatically better."],["S","What about bias in the dataset?"],["P","That's an important part of your analysis. Ask whether the training data adequately represents the population you want the model to work with."],["S","So we're evaluating the model, not just trying to get the highest score."],["P","Correct. A model is useful only in relation to the problem you're trying to solve."]],"words":235,"kind":"dialogue"},{"num":46,"title":"Scientific Poster and Research Presentation","lines":[["P","At the end of the semester, you'll present your research using a scientific poster. You have five minutes to explain your project, followed by questions from the audience."],["S","How much information should we put on the poster?"],["P","Less than you probably think. The poster is not a five-page report printed in large letters. Someone should be able to understand your research question, method, major findings, and conclusion quickly."],["S","Should we include all our results?"],["P","No. Include the results that are relevant to your research question. You can provide additional information if someone asks during the discussion."],["S","What should we say first?"],["P","Start with the problem or research question. Then briefly explain how you investigated it. After that, focus on the findings."],["S","What if someone asks about something we didn't study?"],["P","Don't guess. You can say, \"We didn't investigate that in this study, so I wouldn't want to speculate.\" Then, if appropriate, explain how that question could be studied in future research."],["S","What if they criticize our method?"],["P","Listen carefully before responding. They may have identified a genuine limitation. You can acknowledge it without abandoning your entire project."],["S","Do we have to memorize the presentation?"],["P","No. You should know your material well enough that you aren't reading from the poster. Memorizing every sentence can actually make you less responsive to your audience."],["S","And the questions are part of the grade?"],["P","Yes. I'm evaluating not only how clearly you present your research but also whether you understand its strengths, limitations, and implications."]],"words":250,"kind":"dialogue"}]},{"part":5,"title":"Engineering & Applied Sciences","scripts":[{"num":47,"title":"Engineering Design Project","lines":[["S","Professor, our team is starting the design project, but we're not sure where to begin."],["P","Start with the constraints, not the solution. What does the client actually need, and what limits are you working within—budget, materials, safety codes, timeline?"],["S","We have a rough budget and a list of required specifications."],["P","Good. Then your first task is to translate those specifications into measurable design criteria. \"Strong enough\" isn't a criterion. \"Able to support a load of two hundred kilograms without deflection greater than five millimetres\" is."],["S","So every requirement needs a number attached to it?"],["P","Wherever possible, yes. Otherwise you and your team may not even agree on what \"done\" looks like."],["S","What if two requirements conflict? For example, lighter weight but also higher strength."],["P","That's normal in engineering design. You'll need to make a trade-off and justify it. Don't hide the conflict. Document it and explain why you resolved it the way you did."],["S","Should we build a prototype before finishing the report?"],["P","If time allows, yes. A prototype often reveals problems that calculations alone don't show."],["S","And if the prototype fails?"],["P","Then you've learned something valuable before your client did. Report what failed, why, and what you changed."],["S","So the report isn't just describing the final design."],["P","Correct. I want to see the reasoning that got you there, including what didn't work."]],"words":223,"kind":"dialogue"},{"num":48,"title":"Engineering Laboratory Report","lines":[["P","Let's talk about your lab report from this week's materials-testing experiment."],["S","I wasn't sure how much detail to include in the methods section."],["P","Enough that another engineer could repeat your procedure without guessing. If you skip a step because it seemed obvious to you, it may not be obvious to someone reading the report six months from now."],["S","Should we include every measurement we took, even the ones that seemed off?"],["P","Yes. Don't quietly remove a data point because it doesn't fit your expected curve. If you exclude a result, explain why in the report. Equipment error, contamination, whatever the reason was."],["S","What if our results don't match the theoretical value?"],["P","Then discuss the discrepancy. Was it measurement error, a limitation of the equipment, or something about the experimental setup? A gap between theory and results is often the most interesting part of the report, not a failure."],["S","Our discussion section feels thin. We mostly just restated the results."],["P","That's a common problem. The results section tells me what happened. The discussion section tells me why it matters and what it means for the material's real-world performance."],["S","Should we mention sources of error even if we can't quantify them?"],["P","Yes, but be specific. \"Human error\" tells me nothing. \"Manual timing may have introduced a delay of roughly half a second\" tells me something useful."],["S","So precision matters even when we're being honest about our limitations."],["P","Exactly. Vague honesty isn't much more useful than false confidence."]],"words":245,"kind":"dialogue"},{"num":49,"title":"Engineering Group Presentation","lines":[["P","Your team presentation on the bridge-load analysis is next week. Let's talk about how to divide the work."],["S","Each of us handled a different part of the calculation. Should we each present our own section?"],["P","You can divide the research that way, but the presentation itself needs to read as one connected argument, not four separate reports stapled together."],["S","How do we connect four different calculations into one story?"],["P","Start with the engineering problem you were asked to solve. Then show how each calculation contributes to answering that problem, in a logical order. Loads, then materials, then safety factors, then your final recommendation."],["S","Should we show all our raw calculations on the slides?"],["P","No. Show the key inputs, the key results, and let the audience know detailed calculations are available in an appendix if they want them."],["S","What if the client in the audience asks a question none of us prepared for?"],["P","Then say so honestly. You can say, \"That's outside what we calculated for this phase, but here's how we'd approach it.\" That's a professional answer."],["S","Should everyone speak for an equal amount of time?"],["P","Roughly, but don't force it. If one person's section requires more explanation, let it take more time. What matters most is that the transitions between speakers are smooth."],["S","So the audience shouldn't notice where one person's part ends and another's begins."],["P","Exactly. A strong engineering presentation sounds like one team with one conclusion, not four individual assignments."]],"words":243,"kind":"dialogue"},{"num":50,"title":"Engineering Ethics and Professional Responsibility","lines":[["P","Today we're discussing a case where an engineer discovered a safety issue late in a project."],["S","Is this based on a real situation?"],["P","It's a composite of situations that happen more often than people expect. Here's the scenario: testing reveals a component doesn't meet the safety margin your firm normally requires, but it's still within the legal minimum. The project is behind schedule and over budget. What do you do?"],["S","Technically, it's still legal, so could you just proceed?"],["P","You could. But \"legal\" and \"responsible\" aren't always the same thing. Professional engineering codes generally require you to prioritize public safety above your employer's convenience or your client's schedule."],["S","What would you actually do, practically? Just refuse to sign off?"],["P","The first step is usually to document your concern clearly and raise it with your supervisor or the relevant engineering body, in writing. You're not necessarily stopping the project single-handedly. You're making sure the concern is formally recorded and addressed."],["S","What if your supervisor tells you to proceed anyway?"],["P","Then you may need to escalate further, depending on the severity of the risk. Professional licensing bodies exist partly for this reason. Engineers have both the right and the obligation to report serious safety concerns."],["S","That sounds like it could put someone's job at risk."],["P","It can. That's exactly why professional codes exist: to protect the public, and to give engineers backing when they raise a legitimate concern. Ethics in engineering isn't an abstract topic. It's a practical part of the job."]],"words":250,"kind":"dialogue"},{"num":51,"title":"Technical Feasibility Report","lines":[["P","Your next assignment is a feasibility report comparing two possible solutions to the same technical problem."],["S","Do we have to recommend one of them?"],["P","Yes, eventually. But don't start with a recommendation and then look for evidence to support it. Evaluate both options fairly first."],["S","What criteria should we use to compare them?"],["P","That depends on the problem, but common ones include cost, reliability, maintenance requirements, safety, and how well the option meets the original specifications. Decide on your criteria before you start comparing, not after."],["S","What if one option is cheaper but less reliable?"],["P","Then that's your trade-off, and you need to discuss it explicitly. Don't just present a table of numbers and expect the reader to draw the conclusion themselves."],["S","Should we include a cost estimate even if we're not completely certain about the numbers?"],["P","Yes, but label your assumptions clearly. A feasibility report with a clearly stated estimate is more useful than one that avoids numbers entirely because they might be wrong."],["S","What happens if neither option is actually feasible?"],["P","Then say so. A feasibility report that honestly concludes neither option meets the requirements is more valuable to a client than one that forces a weak recommendation just to have an answer."],["S","So the goal isn't necessarily to find a winner."],["P","The goal is to give the client an honest, evidence-based basis for their decision. Sometimes that means recommending neither option, or recommending further investigation first."]],"words":239,"kind":"dialogue"},{"num":52,"title":"Engineering Research Proposal","lines":[["P","Your final project this term begins with a research proposal. I want to see the question before I see any data."],["S","Can our question be about improving an existing design?"],["P","Yes, but be specific about what \"improving\" means. Faster? Cheaper? More energy-efficient? Safer under certain conditions? Each of those leads to a different kind of investigation."],["S","We're interested in reducing energy consumption in small electric motors."],["P","That's a reasonable direction, but it's still broad. Under what conditions? For what application? Compared to what baseline?"],["S","Maybe reducing energy loss in small motors used in household appliances, compared to a standard commercial model."],["P","Better. Now, what method will you use to test that?"],["S","We were planning to build a prototype and measure its performance directly."],["P","That's one option. You could also rely on simulation, or a combination of both. Explain in your proposal why you chose your method and what its limitations are."],["S","Do we need to prove our design will actually work before we propose it?"],["P","No. A proposal describes what you intend to investigate and how, not the results. I'm evaluating whether your question is answerable and your method is appropriate, not whether you already know the outcome."],["S","What if we discover partway through that our original method doesn't work?"],["P","Then you adjust it and explain the change in your final report. A proposal is a plan, not a contract you can never modify."]],"words":234,"kind":"dialogue"},{"num":53,"title":"Presenting Technical Work to a Non-Technical Audience","lines":[["P","For your final assignment this term, you'll present your project to a panel that includes people without an engineering background."],["S","Should we simplify the technical details?"],["P","Simplify the language, not the substance. There's a difference between making something easier to understand and leaving out the parts that matter."],["S","How do we explain something like stress analysis without using the technical terms?"],["P","Use an analogy grounded in something familiar, then connect it back to your actual finding. For example, you might compare distributed load to how weight spreads across a bridge when several people stand on it, rather than one person jumping in the middle."],["S","What if someone on the panel asks a highly technical question?"],["P","Answer it clearly, then check whether the audience followed you. You can say, \"Let me explain that in a more everyday way as well,\" and offer both versions."],["S","Should we avoid jargon completely?"],["P","Not completely. Some terms may be necessary. But when you use one, define it briefly the first time, in plain language."],["S","What's the biggest mistake engineers make presenting to a general audience?"],["P","Assuming that because something is obvious to them, it's obvious to everyone. Or the opposite mistake: being so simplified that the audience walks away without understanding what was actually accomplished."],["S","So the goal is respecting the audience's intelligence without assuming their technical background."],["P","Exactly. That balance is a skill you'll use constantly outside university, whenever you explain your work to a client, a manager, or the public."]],"words":247,"kind":"dialogue"}]},{"part":6,"title":"Health & Life Sciences","scripts":[{"num":54,"title":"Nursing Patient Case Study","lines":[["P","For your next assignment, you'll analyze a patient case study. The case contains information about the patient's history, symptoms, test results, and current treatment. Your task is to explain how you would approach the case using the evidence and concepts we've studied."],["S","Are we supposed to diagnose the patient?"],["P","Not exactly. You should identify the main clinical concerns and explain what additional information would be relevant. Don't invent information that isn't included in the case."],["S","What if we think we know what the diagnosis is?"],["P","You can discuss possible explanations, but be precise about your level of certainty. A case study isn't an opportunity to fill in missing information with assumptions."],["S","Should we discuss all the symptoms?"],["P","Discuss the symptoms that are relevant to your analysis. Don't simply repeat the entire case. I'm looking for reasoning."],["S","What if two sources recommend different approaches?"],["P","That's something you should investigate. Compare the sources. They may have different populations, evidence, or assumptions."],["S","So we're not expected to find one perfect answer?"],["P","Correct. In health sciences, the evidence is sometimes incomplete or conflicting. Your job is to explain what the evidence supports and where uncertainty remains."],["S","How should we organize the paper?"],["P","Begin with the main clinical issue. Then discuss the relevant evidence, possible explanations, and your reasoning. Finish by identifying what additional information would help resolve the uncertainty."]],"words":225,"kind":"dialogue"},{"num":55,"title":"Nursing Group Presentation","lines":[["P","Your nursing presentation will be completed in groups of four. Your topic is patient education, but I don't want four separate presentations. Your group needs to develop one coherent presentation around a central question."],["S","Could each person talk about a different patient education strategy?"],["P","Yes, provided those strategies contribute to the same overall argument."],["S","How long does each person have?"],["P","You have fifteen minutes as a group. Don't divide the time mechanically into three minutes and forty-five seconds each. Some sections will naturally require more time than others."],["S","What should the introduction include?"],["P","Explain the patient population and the problem you're addressing. Then tell us what your presentation will examine."],["S","Do we need statistics?"],["P","Use statistics when they help establish your point. Don't include numbers simply because they make a presentation look more academic."],["S","What happens if one person's research doesn't support the group's conclusion?"],["P","Discuss it. Don't simply remove inconvenient evidence. Your conclusion may need to become more qualified."],["S","Should we practice together?"],["P","Absolutely. I want you to practice the transitions between speakers and make sure your terminology is consistent."],["S","What if someone asks a question about another person's section?"],["P","Everyone should understand the entire presentation. You can have different responsibilities, but you are submitting one group project."]],"words":209,"kind":"dialogue"},{"num":56,"title":"Medical Research Assignment","lines":[["P","For this assignment, you'll evaluate research on a specific medical question. I want you to pay particular attention to the quality of the evidence."],["S","How many articles should we use?"],["P","There isn't a magic number. Three highly relevant studies may be more useful than twelve articles that don't actually address your question."],["S","Should we only choose studies that agree with our position?"],["P","No. You should actively look for credible evidence that challenges your initial interpretation."],["S","What if one study says something works and another says it doesn't?"],["P","Don't immediately decide that one must be wrong. Look at the study designs, populations, sample sizes, methods, and outcomes."],["S","So two studies can reach different conclusions without one necessarily being poorly done?"],["P","Exactly. Context matters."],["S","How certain should we be in the conclusion?"],["P","As certain as the evidence allows, and no more. If the evidence is promising but limited, say that. If several strong studies point in the same direction, you can make a stronger statement."],["S","What do you mean by \"limitations\"?"],["P","Limitations are factors that affect how confidently we can interpret the findings. They might include sample size, study design, measurement methods, or the population studied."]],"words":194,"kind":"dialogue"},{"num":57,"title":"Pharmacy Presentation","lines":[["P","Your pharmacy presentation will examine a medication-related topic. Be careful with the language you use. Medical and pharmaceutical claims need to be precise."],["S","Can we say that a medication is effective?"],["P","Yes, if you have appropriate evidence. But effective for whom, for what condition, and compared with what?"],["S","So \"effective\" isn't enough?"],["P","Not by itself. You need context."],["S","What about side effects?"],["P","They are important, but don't simply create a long list. Explain which adverse effects are relevant and what the evidence says about them."],["S","Should we include everything we find?"],["P","No. More information isn't automatically better. Select information that helps answer your research question."],["S","What if different sources give different recommendations?"],["P","Compare them. Look at when the sources were published, the evidence they used, and the population they were discussing."],["S","Do we have to give our own recommendation?"],["P","Only if the assignment question asks you to. Don't add a recommendation simply because you think every presentation should end with one."]],"words":161,"kind":"dialogue"},{"num":58,"title":"Biology Laboratory Report","lines":[["P","Your biology laboratory report is due next Friday. One point I want to emphasize is the difference between saying that your experiment \"proved\" something and saying that your results \"supported\" a hypothesis."],["S","Is \"proved\" too strong?"],["P","Usually, yes. A single experiment rarely proves a scientific explanation in an absolute sense."],["S","What should we say instead?"],["P","You might say, \"The results supported our hypothesis,\" assuming they actually did."],["S","What if the results didn't support it?"],["P","Then say so. Explain what you observed and discuss possible reasons."],["S","Do we need to discuss every possible limitation?"],["P","No. Discuss limitations that are relevant to your experiment and could reasonably affect your interpretation."],["S","Should the conclusion repeat the Results section?"],["P","Not word for word. The conclusion should answer the research question and explain what the results mean."],["S","What makes the discussion strong?"],["P","Connecting your findings to biological concepts and explaining whether your findings are consistent with previous research."]],"words":153,"kind":"dialogue"},{"num":59,"title":"Public Health Research Project","lines":[["P","Your public health project will examine access to health services. Before you begin collecting information, I want you to define exactly what you mean by \"access.\""],["S","Doesn't access just mean whether people can get healthcare?"],["P","It can mean that, but it's more complicated. Access might involve cost, physical location, transportation, language, availability, waiting times, or other barriers."],["S","Should we include all of those?"],["P","Not necessarily. If you include everything, your project will become too broad."],["S","How do we narrow it?"],["P","Choose a population, location, type of service, and specific barrier. For example, you might examine transportation barriers affecting access to a particular type of healthcare."],["S","What if different studies define access differently?"],["P","That is important. Explain the difference rather than treating the studies as if they were measuring exactly the same thing."],["S","Can we change our research question after we start?"],["P","Yes. Research questions often evolve as you learn more. But if you make a significant change, document it and make sure the final paper reflects the new question consistently."]],"words":170,"kind":"dialogue"},{"num":60,"title":"Evidence-Based Practice: Conflicting Clinical Sources","lines":[["P","Today we're going to examine what you should do when two credible clinical sources don't appear to agree."],["S","I thought we were supposed to find the most reliable source and use that one."],["P","Reliability is important, but sometimes two reputable sources can interpret evidence differently."],["S","How do we decide which one to use?"],["P","First, identify exactly where they disagree. Then examine the evidence behind each position."],["S","Should we look at the publication date?"],["P","Yes. Evidence can change over time. But don't assume that the newest source is automatically correct."],["S","What else should we consider?"],["P","Look at the population, study design, outcome being measured, and strength of the evidence."],["S","What if we're still not sure?"],["P","Then say that. Your assignment isn't a test of whether you can manufacture certainty."],["S","So we can conclude that the evidence is inconclusive?"],["P","If that's what the evidence supports, yes. But explain why it is inconclusive. \"More research is needed\" is weak unless you tell us what kind of research would actually help."]],"words":167,"kind":"dialogue"}]},{"part":7,"title":"Psychology & Social Sciences","scripts":[{"num":61,"title":"Psychology Research Paper","lines":[["P","For your psychology research paper, you'll investigate a question related to human behaviour. Your first task is to make sure the question is specific enough to research."],["S","Could I write about stress?"],["P","Not by itself. Stress is an enormous subject. You need to identify a particular population, situation, or relationship."],["S","What about stress among university students?"],["P","Better, but still broad. You could investigate the relationship between academic workload and perceived stress among first-year students."],["S","Do we have to collect our own data?"],["P","No. This assignment is based on existing research."],["S","How many studies should we compare?"],["P","At least five substantial academic sources. I want you to compare their findings rather than simply summarize them one after another."],["S","What if the studies disagree?"],["P","Ask why. Differences in participants, methods, measurements, or circumstances may explain the disagreement."],["S","How careful do we need to be with psychological claims?"],["P","Very careful. Avoid statements like \"This proves that people behave this way.\" Psychological research usually supports more qualified conclusions."]],"words":164,"kind":"dialogue"},{"num":62,"title":"Designing a Psychology Research Study","lines":[["P","For your next assignment, you'll design a psychology research study. You aren't actually conducting the study. You're demonstrating that you understand how a study should be designed."],["S","Can I study whether music affects concentration?"],["P","Yes. But you'll need to define both \"music\" and \"concentration.\""],["S","Can't we just say whether people concentrate better?"],["P","That's too vague. How will you measure concentration? Time on task? Number of correct answers? Reaction time?"],["S","I see. We need measurable variables."],["P","Exactly. You also need to consider your participants."],["S","Could we use university students?"],["P","You could, but explain why. Also consider whether your findings could be generalized beyond university students."],["S","What about other factors that might affect concentration?"],["P","Those are potential confounding variables. Sleep, caffeine, noise, prior experience, and many other factors could influence the results."],["S","Do we have to control everything?"],["P","You should identify important variables and explain how you would control or account for them."],["S","And then discuss limitations?"],["P","Yes. Every research design has limitations. The important thing is that you recognize them."]],"words":169,"kind":"dialogue"},{"num":63,"title":"Research Ethics and Human Participants","lines":[["P","Before you design your research study, we need to discuss research ethics. If human participants are involved, researchers have responsibilities that go beyond collecting useful data."],["S","Does every participant have to know exactly what the study is about?"],["P","They need enough information to provide informed consent. There are circumstances in which researchers may not reveal every detail initially, but those situations require careful ethical justification."],["S","What exactly is informed consent?"],["P","Participants need to understand what participation involves, the relevant risks, and their rights. They should also understand that participation is voluntary."],["S","What if someone agrees and then changes their mind?"],["P","They should generally be able to withdraw according to the conditions explained during the consent process."],["S","What about confidentiality?"],["P","That's another important issue. You need to explain how participant information will be protected and who will have access to it."],["S","So even a simple university research project can have ethical concerns."],["P","Absolutely. Ethical research isn't something you think about after collecting the data. It needs to be considered during the design stage."]],"words":172,"kind":"dialogue"},{"num":64,"title":"Sociology: Comparing Theories","lines":[["P","Your sociology essay will compare two theories that attempt to explain social inequality."],["S","Should I explain one theory and then explain the other?"],["P","That's necessary, but it isn't enough. The assignment asks you to compare them."],["S","So I should discuss their similarities and differences?"],["P","Yes, but go further. Ask what each theory explains particularly well and where each theory has limitations."],["S","Can I use examples from Canada?"],["P","Certainly. Examples can help illustrate the theories."],["S","Would an example prove that a theory is correct?"],["P","No. An example can illustrate an idea, but it doesn't automatically prove a broader theoretical claim."],["S","What should my thesis look like?"],["P","It should make a comparative claim. For example, you might argue that one theory explains one dimension of inequality particularly well, while the other provides a better explanation of another dimension."],["S","So I don't have to say one theory is completely right and the other is completely wrong."],["P","Correct. Social theories are analytical frameworks. Your task is to evaluate what they help us understand."]],"words":169,"kind":"dialogue"},{"num":65,"title":"Political Science Argumentative Essay","lines":[["P","Your political science assignment is an argumentative essay. You will examine a policy question and construct an evidence-based argument."],["S","Do we have to choose one side?"],["P","You need to answer the question clearly, but I don't want a purely opinion-based essay."],["S","What kind of evidence should we use?"],["P","That depends on your question. Academic research, government documents, official statistics, and other credible sources may all be appropriate."],["S","Do we need to discuss the opposing argument?"],["P","Yes. A strong argumentative essay recognizes serious counterarguments."],["S","What if I think the counterargument is completely wrong?"],["P","Then explain why. Don't dismiss it with a sentence such as, \"Some people disagree.\" Identify the actual argument and respond to its evidence or reasoning."],["S","Can I use emotional language?"],["P","Be precise. Political issues can be emotionally important, but academic writing requires you to distinguish evidence from rhetoric."],["S","So the goal isn't just to persuade people who already agree with us."],["P","Correct. Your argument should be strong enough that someone who disagrees can understand exactly how you reached your conclusion."]],"words":172,"kind":"dialogue"},{"num":66,"title":"Conducting Qualitative Interviews","lines":[["P","For your social science research project, you'll conduct several interviews and analyze the responses for common themes."],["S","Can I ask people whether they agree with my theory?"],["P","That's not the best approach. Your questions should be as neutral as possible."],["S","What would be a biased question?"],["P","For example, \"Don't you think university students are under too much pressure?\" That question suggests the answer."],["S","What would be better?"],["P","\"How would you describe the pressures you experience as a university student?\" That allows the participant to answer in their own terms."],["S","Do I have to ask every person exactly the same questions?"],["P","You should have a consistent interview guide, but qualitative interviews can allow you to ask follow-up questions when something interesting emerges."],["S","How do we analyze the interviews?"],["P","Look for recurring themes, differences, and unexpected responses. Don't simply choose quotations that support your original assumptions."],["S","What if only one person gives an interesting answer?"],["P","You can mention it, but don't treat one unusual response as representative of the entire group."]],"words":169,"kind":"dialogue"}]},{"part":8,"title":"Architecture, Communications & Education","scripts":[{"num":67,"title":"Architecture Design Presentation","lines":[["P","Today we're going to discuss your final architecture presentation. You have ten minutes to present your design, followed by five minutes of questions."],["S","Should we start by showing the final model?"],["P","You can show it early, but don't begin with five minutes of visual details. Start by explaining the problem your design is addressing."],["S","Should we explain the site?"],["P","Yes. The site is part of the design problem. Discuss relevant environmental, social, functional, and physical conditions."],["S","How much should we talk about the design process?"],["P","Enough to explain your major decisions. I want to understand why you chose this form, material, circulation system, or spatial arrangement."],["S","What if we changed the design several times?"],["P","That's useful. Show how the design developed and what you learned through the process."],["S","Do we have to talk about weaknesses?"],["P","Yes. Every design has limitations. Identifying them demonstrates that you understand the project."],["S","What if someone disagrees with one of our choices?"],["P","Listen to the question carefully. You can explain your reasoning without becoming defensive."]],"words":170,"kind":"dialogue"},{"num":68,"title":"Architecture Design Critique","lines":[["P","Today is your design critique. I want you to remember that the purpose of a critique is not to tell you whether your project is personally \"good\" or \"bad.\""],["S","Sometimes the feedback feels pretty negative."],["P","That's normal. A critique is intended to identify problems and possibilities for improvement."],["S","What should we say if we disagree with the feedback?"],["P","First make sure you understand it. You can ask, \"Could you clarify what you mean by the circulation problem?\""],["S","And then explain why we made that choice?"],["P","Yes. You can say, \"We considered that option, but we chose this arrangement because...\" That's a professional response."],["S","Do we have to follow every suggestion?"],["P","No. You're responsible for deciding which feedback is relevant. But if you reject a suggestion, you should have a reason."],["S","What if several professors give us different advice?"],["P","That's part of the design process. Compare the reasoning behind their comments and decide which advice best fits your project's objectives."]],"words":159,"kind":"dialogue"},{"num":69,"title":"Urban Planning Research Project","lines":[["P","Your urban planning project will examine a proposed change to a neighbourhood. You will need to consider the perspectives of several stakeholders."],["S","Can we focus on whether the project is good or bad?"],["P","I'd prefer more precise language. Good for whom? And according to what criteria?"],["S","So we should identify the different interests involved."],["P","Exactly. Residents, businesses, developers, transit users, local government, and other groups may have different priorities."],["S","What if the evidence doesn't tell us what will happen?"],["P","Distinguish evidence from prediction. You can make a prediction, but identify it as a prediction and explain what it's based on."],["S","Do we need to recommend a solution?"],["P","Yes. After analyzing the evidence and stakeholder concerns, make a recommendation and explain the trade-offs."],["S","Could our recommendation be a compromise?"],["P","Certainly. Urban planning frequently involves competing objectives. A recommendation doesn't have to satisfy every stakeholder completely."]],"words":144,"kind":"dialogue"},{"num":70,"title":"Communications Media Analysis","lines":[["P","Your communications assignment is a media analysis. Choose one advertisement, news story, campaign, or other media message and analyze how it communicates with its intended audience."],["S","Can I say that the message is biased?"],["P","You can discuss bias, but you need to demonstrate it. Don't simply label something biased because you disagree with it."],["S","What should we look at?"],["P","Consider word choice, images, tone, what information is emphasized, and what information may be omitted."],["S","Do we have to discuss the audience?"],["P","Absolutely. A message doesn't exist in isolation. Ask who the intended audience is and how the message is designed to appeal to that audience."],["S","What if different people interpret the message differently?"],["P","That's worth discussing. Intended meaning and received meaning aren't always identical."],["S","Can we use our personal reaction?"],["P","You can mention it if it's relevant, but don't make your personal reaction the main evidence."]],"words":146,"kind":"dialogue"},{"num":71,"title":"Public Relations Campaign","lines":[["P","For your public relations assignment, you'll design a campaign for an organization facing a communication problem."],["S","Can we start by creating a slogan?"],["P","Not yet. First define the communication problem."],["S","Why is that so important?"],["P","Because a creative message won't solve the wrong problem. You need to know what your audience currently thinks, what you want them to understand, and what action you want them to take."],["S","How do we identify the audience?"],["P","Be specific. Different groups may require different messages."],["S","Should we test the campaign?"],["P","Yes, if possible. Ask people from your target audience how they interpret the message."],["S","What if they interpret it differently from what we intended?"],["P","Then you've discovered something important. Revise the message."],["S","So communication isn't only about what we say."],["P","Correct. It's also about what the audience understands."]],"words":134,"kind":"dialogue"},{"num":72,"title":"Education Lesson Plan","lines":[["P","Your education assignment is to create a lesson plan for a secondary school class. I want you to begin with the learning objective."],["S","Can I start with an activity?"],["P","You can, but the activity should serve the objective. Don't choose an entertaining activity and then try to find an objective that fits afterward."],["S","What makes a good objective?"],["P","It should describe what students will be able to do by the end of the lesson."],["S","What about assessment?"],["P","Your assessment should give you evidence that students achieved the objective."],["S","So the activity, objective, and assessment need to connect."],["P","Exactly."],["S","What if some students finish early?"],["P","Plan for that. Also consider students who need additional support."],["S","Do we need to plan every minute?"],["P","Give realistic timing, but remember that classroom plans can change. A good teacher adjusts when students need more explanation or when an activity takes longer than expected."]],"words":148,"kind":"dialogue"},{"num":73,"title":"Education Reflective Essay","lines":[["P","Your final education assignment is a reflective essay. Reflection is more than describing what happened during your teaching experience."],["S","So I shouldn't just describe the lesson?"],["P","Correct. Start with the experience, but then analyze it."],["S","What does analysis mean in a reflection?"],["P","Ask why something happened, what assumptions you made, what evidence you have, and what you would change."],["S","Can I say, \"The lesson went badly\"?"],["P","That's too general. Explain what happened. Perhaps students didn't understand the instructions or the activity took longer than expected."],["S","Then I explain why?"],["P","Exactly. And if you're not certain why something happened, say that. You can propose possible explanations."],["S","Should I criticize myself?"],["P","Self-criticism isn't the objective. Learning is. Identify what you would do differently and why."],["S","What should the conclusion focus on?"],["P","Future action. Explain how the experience will influence your teaching decisions in the future."]],"words":143,"kind":"dialogue"}]},{"part":9,"title":"Law & Final Advanced Scenarios","scripts":[{"num":74,"title":"Law: Case Brief and Legal Research","lines":[["P","Your next assignment is a case brief and legal research memorandum. This assignment is designed to make sure you can distinguish the facts of a case from the legal issue and from the court's reasoning."],["S","Should the first section summarize the entire case?"],["P","Give us the relevant facts, but don't include every detail. Ask yourself which facts are important to the legal issue."],["S","And then we identify the legal issue?"],["P","Yes. State it as a legal question. After that, explain the decision and the reasoning behind it."],["S","Can we use a textbook to explain the law?"],["P","You can use secondary sources to help you understand the law, but you need to identify the relevant primary authorities as well."],["S","What's the difference?"],["P","Primary authorities include sources such as legislation and judicial decisions. Secondary sources analyze or explain the law."],["S","What if two cases seem to point in different directions?"],["P","That's exactly the sort of issue you should investigate. Look carefully at the facts, legal questions, jurisdiction, and reasoning."],["S","Do we have to decide which case is correct?"],["P","Not necessarily. Explain the distinction and what it means for your legal analysis."],["S","What makes the final memorandum strong?"],["P","Precision. I want to see that you can identify the relevant authority, apply it to the facts, acknowledge uncertainty, and reach a conclusion that follows from your analysis."]],"words":223,"kind":"dialogue"},{"num":75,"title":"Final Independent Project: Debate, Counterargument, and Research","lines":[["P","For your final project, you'll bring together many of the skills we've practiced this semester. You will choose a complex question in your field, conduct independent research, prepare an argument, and present your conclusions."],["S","Are we supposed to choose a side immediately?"],["P","No. Begin with the question. Your initial position may change as you investigate the evidence."],["S","How many sources do we need?"],["P","There isn't a fixed number. Use enough appropriate evidence to answer the question properly. Source quality and relevance matter more than simply reaching a target number."],["S","What if the evidence doesn't give us a clear answer?"],["P","Then your conclusion should reflect that uncertainty."],["S","Do we have to include a counterargument?"],["P","Yes. Identify the strongest reasonable argument against your position and respond to it fairly."],["S","What if the counterargument is actually stronger?"],["P","Then you need to take that seriously. Your research may lead you to modify your original position."],["S","Are we being graded on whether we have the \"right\" opinion?"],["P","No. I'm evaluating the quality of your question, research, reasoning, evidence, organization, and response to competing interpretations."],["S","So this is basically showing that we can work independently."],["P","Exactly. By this point in university, I shouldn't have to tell you every step. I expect you to identify what you need to know, find appropriate sources, ask useful questions, recognize limitations, and make reasoned decisions about your work."],["S","And if we realize we've misunderstood the assignment?"],["P","Ask. Independent work doesn't mean working without communication. It means taking responsibility for recognizing what you need and doing something about it."],["S","So the final skill is knowing when to work independently and when to ask for help."],["P","That's an important part of university. Independence doesn't mean knowing everything. It means knowing what you don't know, finding out, and taking responsibility for the result."]],"words":300,"kind":"dialogue"}]}];

function renderScript(n) {

  $("#view").innerHTML = `<article class="script" data-part="${s.part}">

        <div class="facts"><span class="kind">${s.kind === "dialogue" ? "Conversation" : "Lecture"}</span><span>${s.words} words</span><span>${minutes(s.words)}</span>${s.kind === "dialogue" ? `<span>${turns} turns</span>` : ""}${DONE.has(s.num) ? `<span>✓ Completed</span>` : ""}</div>
      </div>
    </div>
    <ol class="rounds" aria-label="Rounds">${ROUNDS.map((r, k) => `<li><button data-round="${k}" ${k === ST.round ? 'aria-current="step"' : ''} class="${ST.done.has(k) ? 'done' : ''}"><i>${ST.done.has(k) && k !== ST.round ? "✓" : k + 1}</i>${r[0]}</button></li>`).join("")}</ol>

      ${prev ? `<button data-script="${prev.num}"><small>Previous</small><span>${prev.num}. ${esc(prev.title)}</span></button>` : "<span></span>"}

  document.querySelectorAll("[data-round]").forEach(b => b.onclick = () => goRound(+b.dataset.round));
  renderPanel(s);
  checkAudio(s.num).then(ok => { if (ok && !ST.hasAudio && ST.num === s.num) { ST.hasAudio = true; renderPanel(s); } });
}
function goRound(k) { saveFields(); stopAll(); ST.done.add(ST.round); ST.round = k; renderScript(ST.num); const r = document.querySelector(".rounds"); window.scrollTo({ top: r.getBoundingClientRect().top + scrollY - 70 }); }
function saveFields() { const g = $("#gist"), a = $("#answer"), nm = $("#sname"); if (g) ST.gist = g.value; if (a) ST.answer = a.value; if (nm) { ST.name = nm.value; store.set("name", nm.value); } }

function dialogueHTML(s, showText) {

      <div class="turns">${s.lines.map((l, ti) => `<span class="${l[0]}" data-turn="${ti}">${WHO[l[0]]}</span>`).join("")}</div></div>`;

}

function playerHTML(opts) {
  const { lines = false, echo = false } = opts || {};
  if (ST.hasAudio) return `<div class="deck recording">
      <audio id="rec" controls preload="metadata" src="${audioUrl(ST.num)}"></audio>
      <div class="deck-row"><button class="btn secondary" id="back10">Back 10 seconds</button>
        <label>Speed <select id="arate"><option value="0.6">Very slow</option><option value="0.75">Slow</option><option value="0.9">A little slow</option><option value="1">Natural</option></select></label></div>
    </div><p class="voice-note">This is your teacher's recording. Slow it down the first time if you need to.</p>`;

      <div class="deck-row">
