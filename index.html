<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>University Listening Lab | Ron Taylor Masterclass</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#132038; --navy-2:#1d2d4b; --navy-3:#2a3c5f; --chalk:#e7ebf2; --dim:#9ba8bf;
  --paper:#f3f4f7; --white:#fff; --ink:#1a2233; --muted:#5a6477; --rule:#d9dde5;
  --gold:#c49a3a; --gold-soft:#f6ecd4;
  --missed:#f7dca4; --missed-ink:#6a4300; --extra:#b3261e;
  --p1:#23407a; --p2:#6b2d5c; --p3:#2d6a4f; --p4:#1f5e7a; --p5:#8a4b12;
  --p6:#9b2f3f; --p7:#4b3f8f; --p8:#56621a; --p9:#384a62;
  --part:var(--p1);
  --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
  --sans:"Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
[data-part="1"]{--part:var(--p1)} [data-part="2"]{--part:var(--p2)} [data-part="3"]{--part:var(--p3)}
[data-part="4"]{--part:var(--p4)} [data-part="5"]{--part:var(--p5)} [data-part="6"]{--part:var(--p6)}
[data-part="7"]{--part:var(--p7)} [data-part="8"]{--part:var(--p8)} [data-part="9"]{--part:var(--p9)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--paper);line-height:1.55;font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
a{color:var(--part)}

.shell{display:grid;grid-template-columns:330px 1fr;min-height:100vh}
aside{background:var(--navy);color:var(--chalk);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.brand{padding:26px 24px 20px;border-bottom:1px solid var(--navy-3);display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.crest{width:46px;height:46px;border:2px solid var(--gold);border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-weight:700;color:var(--gold);font-size:17px;letter-spacing:.02em}
.brand h1{font-family:var(--serif);font-weight:600;font-size:23px;line-height:1.1;color:var(--white)}
.brand p{font-size:13px;color:var(--dim);margin-top:3px}
.search{padding:14px 24px;border-bottom:1px solid var(--navy-3)}
.search input{width:100%;background:var(--navy-2);border:1px solid var(--navy-3);border-radius:8px;padding:9px 12px;color:var(--white)}
.search input::placeholder{color:#8794ad}
.progress-mini{padding:12px 24px;border-bottom:1px solid var(--navy-3);font-size:13px;color:var(--dim)}
.progress-mini .bar{height:5px;background:var(--navy-3);border-radius:3px;margin-top:6px;overflow:hidden}
.progress-mini .bar i{display:block;height:100%;background:var(--gold);border-radius:3px}
nav{overflow-y:auto;flex:1;padding:6px 0 24px}
.home-link{display:block;width:100%;text-align:left;background:none;border:0;color:var(--chalk);padding:12px 24px 8px;cursor:pointer;font-size:14.5px;font-weight:600}
.home-link:hover{color:var(--gold)}
details.part{margin-top:2px}
details.part summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:28px 1fr auto;align-items:baseline;gap:8px;padding:9px 24px;font-family:var(--serif);font-size:16.5px;font-weight:600;color:var(--white)}
details.part summary::-webkit-details-marker{display:none}
details.part summary b{font-family:var(--sans);font-size:12px;font-weight:700;color:var(--navy);background:var(--dim);border-radius:4px;text-align:center;padding:1px 0}
details.part[open] summary b{background:var(--gold)}
details.part summary small{font-family:var(--sans);font-size:12px;font-weight:400;color:var(--dim)}
details.part summary:hover{background:var(--navy-2)}
nav ol{list-style:none;padding:2px 0 8px}
nav li button{display:grid;grid-template-columns:30px 1fr 16px;gap:6px;width:100%;text-align:left;background:none;border:0;color:#c9d1df;padding:6px 20px 6px 40px;cursor:pointer;font-size:14px;line-height:1.35}
nav li button span:first-child{color:var(--dim);font-variant-numeric:tabular-nums}
nav li button:hover{background:var(--navy-2);color:var(--white)}
nav li button[aria-current="true"]{background:var(--navy-3);color:var(--white);box-shadow:inset 3px 0 0 var(--gold)}
nav li button .ck{color:var(--gold);font-size:12px}
.empty{padding:16px 24px;color:var(--dim);font-size:14px}

.scrim{display:none}
main{min-width:0;grid-column:2}
.topbar{display:none}
.wrap{max-width:800px;margin:0 auto;padding:48px 32px 90px}

/* home */
.hero{border-bottom:1px solid var(--rule);padding-bottom:30px;margin-bottom:10px}
.hero h2{font-family:var(--serif);font-size:48px;font-weight:600;line-height:1.05;letter-spacing:-.01em;color:var(--navy);margin-bottom:18px;max-width:17ch}
.hero p{font-size:17.5px;max-width:62ch;margin-bottom:12px;color:#2b3446}
.hero .exchange{margin:26px 0 6px;max-width:560px}
.sec{font-family:var(--serif);font-size:30px;font-weight:600;margin:40px 0 6px;color:var(--navy)}
.sub{color:var(--muted);max-width:62ch;margin-bottom:14px}
.steps{list-style:none;display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin:18px 0 8px;border:1px solid var(--rule);border-radius:10px;background:var(--white);overflow:hidden}
.steps li{padding:16px 18px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.steps li:nth-child(3n){border-right:0}
.steps li:nth-last-child(-n+3){border-bottom:0}
.steps b{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:19px;font-weight:600;color:var(--navy)}
.steps b i{font-style:normal;font-family:var(--sans);font-size:13px;width:24px;height:24px;border-radius:50%;background:var(--navy);color:var(--gold);display:grid;place-items:center}
.steps span{display:block;font-size:14px;color:var(--muted);margin-top:4px;line-height:1.4}
.parts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:16px}
.parts-grid button{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--white);border:1px solid var(--rule);border-radius:10px;padding:16px 16px 14px;cursor:pointer;position:relative;overflow:hidden}
.parts-grid button::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--part)}
.parts-grid button:hover{border-color:var(--part)}
.parts-grid .pn{font-size:13px;font-weight:700;color:var(--part)}
.parts-grid strong{font-family:var(--serif);font-size:20px;line-height:1.15;color:var(--ink)}
.parts-grid .pd{font-size:14px;color:var(--muted);line-height:1.4}
.parts-grid .pc{font-size:13px;color:var(--part);font-weight:600;margin-top:auto;padding-top:6px}
.toc{columns:2 300px;column-gap:30px;margin:14px 0 30px}
.toc section{break-inside:avoid;margin-bottom:22px}
.toc h4{font-family:var(--serif);font-size:19px;font-weight:600;margin-bottom:4px;color:var(--part);padding-bottom:5px;border-bottom:2px solid var(--part)}
.toc ol{list-style:none}
.toc button{display:grid;grid-template-columns:32px 1fr auto;width:100%;text-align:left;background:none;border:0;padding:4px 0;cursor:pointer;font-size:15px;color:var(--ink);gap:4px}
.toc button span:first-child{color:var(--part);font-variant-numeric:tabular-nums;font-weight:600}
.toc button:hover{color:var(--part)}
.toc .ck{color:var(--gold);font-size:13px}
.notice{background:var(--white);border:1px solid var(--rule);border-left:4px solid var(--gold);padding:18px 20px;margin:22px 0;border-radius:0 8px 8px 0}
.notice h3{font-size:16px;margin-bottom:6px}
.notice p{font-size:15px;color:var(--muted)}
.resetrow{font-size:14px;color:var(--muted);margin-top:8px}
.linkbtn{background:none;border:0;color:var(--part);text-decoration:underline;cursor:pointer;padding:0}

/* script page */
.plate{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:start;margin-bottom:24px}
.num{width:92px;height:92px;border-radius:12px;background:var(--part);color:var(--white);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 -6px 0 rgba(0,0,0,.18)}
.num small{font-size:11.5px;font-weight:600;opacity:.8}
.num b{font-family:var(--serif);font-size:40px;line-height:1;font-weight:600}
.partname{font-size:14px;font-weight:600;color:var(--part)}
.script h2{font-family:var(--serif);font-size:38px;font-weight:600;line-height:1.1;margin:4px 0 10px;color:var(--ink)}
.facts{display:flex;flex-wrap:wrap;gap:8px}
.facts span{font-size:13px;border:1px solid var(--rule);background:var(--white);border-radius:999px;padding:3px 10px;color:var(--muted)}
.facts span.kind{border-color:color-mix(in srgb,var(--part) 35%,#fff);color:var(--part);background:color-mix(in srgb,var(--part) 7%,#fff);font-weight:600}

.rounds{display:grid;grid-template-columns:repeat(6,1fr);list-style:none;margin:0 0 -1px;position:relative;z-index:1}
.rounds button{width:100%;background:transparent;border:1px solid transparent;border-bottom:0;border-radius:10px 10px 0 0;padding:10px 6px 11px;cursor:pointer;font-size:13px;line-height:1.25;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px}
.rounds button i{font-style:normal;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--rule);display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--white)}
.rounds button:hover{color:var(--part)}
.rounds button.done i{background:var(--part);border-color:var(--part);color:var(--white)}
.rounds button[aria-current="step"]{background:var(--white);border-color:var(--rule);color:var(--ink);font-weight:600}
.rounds button[aria-current="step"] i{border-color:var(--part);color:var(--part);background:var(--white);box-shadow:0 0 0 3px color-mix(in srgb,var(--part) 18%,#fff)}
.panel{background:var(--white);border:1px solid var(--rule);border-radius:0 0 12px 12px;padding:24px 26px 22px}
.panel h3{font-family:var(--serif);font-size:27px;font-weight:600;line-height:1.1;margin-bottom:6px;color:var(--part)}
.panel .hint{font-size:15.5px;color:var(--muted);margin-bottom:16px;max-width:64ch}

/* player */
.deck{border:1px solid var(--rule);border-radius:10px;background:#f8f9fb;padding:14px 16px;margin-bottom:14px}
.deck-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.deck-row+.deck-row{margin-top:10px;padding-top:10px;border-top:1px solid var(--rule)}
.btn{background:var(--part);color:var(--white);border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-weight:600;font-size:15px}
.btn:hover{filter:brightness(.9)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.secondary{background:var(--white);color:var(--part);border:1px solid var(--rule)}
.btn.secondary:hover{border-color:var(--part);background:color-mix(in srgb,var(--part) 6%,#fff)}
.btn.big{padding:11px 20px;min-width:128px}
.btn.gold{background:var(--navy);color:var(--gold)}
.deck label{font-size:14px;color:var(--muted);display:flex;gap:6px;align-items:center}
.deck select{border:1px solid var(--rule);border-radius:6px;padding:6px 8px;background:var(--white);max-width:210px;font-size:14px}
.deck .sp{margin-left:auto}
.nowline{font-size:14px;color:var(--muted);flex:1;min-width:180px}
.nowline b{color:var(--ink)}
.track{height:6px;background:var(--rule);border-radius:3px;overflow:hidden;margin-top:10px}
.track i{display:block;height:100%;width:0;background:var(--part);transition:width .2s}
.voice-note{font-size:13px;color:var(--muted);margin:2px 0 16px}
.recording audio{width:100%;margin-bottom:6px}
.check{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink);cursor:pointer}
.check input{accent-color:var(--part);width:17px;height:17px}

/* transcript as a dialogue script */
.dlg{margin-top:6px;border-top:1px solid var(--rule)}
.turn{display:grid;grid-template-columns:96px 1fr;gap:14px;padding:12px 0;border-bottom:1px solid #eceef2}
.who{font-size:13px;font-weight:700;padding-top:4px}
.turn.P .who{color:var(--part)}
.turn.S .who{color:#4d5a70}
.turn.S .say{background:#f3f5f8;border-radius:10px;padding:8px 12px;margin-left:-12px}
.say{font-family:var(--serif);font-size:18.5px;line-height:1.7}
.seg{border-radius:4px;transition:background .15s;cursor:pointer}
.seg:hover{background:color-mix(in srgb,var(--part) 8%,transparent)}
.seg.on{background:var(--gold-soft);box-shadow:0 0 0 2px var(--gold-soft)}
.masked{border:1px dashed #b9c1ce;border-radius:10px;padding:22px 24px;color:var(--muted);font-size:15px;background:#fafbfc}
.masked .turns{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.masked .turns span{font-size:12.5px;font-weight:700;border-radius:4px;padding:3px 8px;background:var(--white);border:1px solid var(--rule)}
.masked .turns span.P{color:var(--part)}
.masked .turns span.on{background:var(--gold-soft);border-color:var(--gold)}

.field{margin-top:14px}
.field label{display:block;font-size:14px;font-weight:600;margin-bottom:6px;color:var(--ink)}
.field input{width:100%;max-width:360px;border:1px solid var(--rule);border-radius:8px;padding:9px 12px;background:var(--white)}
textarea{width:100%;min-height:210px;border:1px solid var(--rule);border-radius:10px;padding:14px 16px;background:var(--white);font-size:17px;line-height:1.6;resize:vertical}
textarea.short{min-height:100px}
textarea:focus,.field input:focus{border-color:var(--part);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--part) 15%,#fff)}
.prompts{list-style:none;margin:6px 0 4px;display:grid;gap:6px}
.prompts li{font-size:15px;padding-left:18px;position:relative}
.prompts li::before{content:"";position:absolute;left:2px;top:.62em;width:7px;height:7px;border-radius:50%;background:var(--gold)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.nextrow{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:22px;padding-top:18px;border-top:1px solid var(--rule)}

.result{margin-top:22px;border:1px solid var(--rule);border-radius:10px;padding:20px 22px;background:#fbfbfc}
.score{font-family:var(--serif);font-size:40px;font-weight:600;line-height:1;color:var(--part)}
.score small{font-family:var(--sans);font-size:15px;font-weight:400;color:var(--muted);margin-left:8px}
.legend{font-size:14px;color:var(--muted);margin:12px 0}
.legend mark,.legend del{padding:0 4px}
.diff{font-size:17px;line-height:1.9;font-family:var(--serif)}
mark{background:var(--missed);color:var(--missed-ink);border-radius:3px;padding:0 2px}
mark.small{outline:2px solid #c98a1a;outline-offset:-1px}
del{color:var(--extra);text-decoration:line-through}
.smalls{margin-top:14px;font-size:15px}
.rest{color:#9aa1a8}
.sendbox{margin-top:18px;padding-top:16px;border-top:1px solid var(--rule)}
.sendbox p{font-size:14px;color:var(--muted);margin-top:8px}
.status{font-size:14px;color:var(--part);margin-top:8px;min-height:1.2em}
.done-banner{margin-top:16px;display:flex;gap:12px;align-items:center;background:var(--gold-soft);border:1px solid #e8d49f;border-radius:10px;padding:12px 16px;font-size:15px}

.pager{display:flex;justify-content:space-between;gap:12px;margin-top:40px;padding-top:22px;border-top:1px solid var(--rule)}
.pager button{background:none;border:0;cursor:pointer;text-align:left;max-width:48%;padding:4px 0}
.pager button:last-child{text-align:right;margin-left:auto}
.pager small{display:block;font-size:13px;color:var(--muted)}
.pager span{font-family:var(--serif);font-size:20px;font-weight:600;color:var(--ink)}
.pager button:hover span{color:var(--part)}

@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  main{grid-column:1}
  aside{position:fixed;inset:0 auto 0 0;width:min(340px,88vw);z-index:30;transform:translateX(-100%);transition:transform .2s ease}
  aside.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(10,18,32,.45);z-index:20;display:none}
  .scrim.open{display:block}
  .topbar{display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10;background:var(--navy);color:var(--white);padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
  .topbar button{background:var(--navy-3);color:var(--white);border:0;border-radius:6px;padding:8px 12px;cursor:pointer}
  .topbar strong{font-family:var(--serif);font-size:19px;font-weight:600}
  .wrap{padding:26px 16px 70px}
  .hero h2{font-size:36px}
  .script h2{font-size:29px}
  .plate{grid-template-columns:1fr;gap:12px}
  .num{width:70px;height:70px}.num b{font-size:30px}
  .rounds{grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:8px}
  .rounds button{border:1px solid var(--rule);border-radius:8px;background:var(--white)}
  .panel{border-radius:12px;padding:18px 16px}
  .steps{grid-template-columns:1fr}
  .steps li{border-right:0!important;border-bottom:1px solid var(--rule)!important}
  .steps li:last-child{border-bottom:0!important}
  .turn{grid-template-columns:1fr;gap:2px}
  .turn.S .say{margin-left:0}
  .say{font-size:17.5px}
  .deck .sp{margin-left:0}
}
@media (prefers-reduced-motion: reduce){aside,.track i,.seg{transition:none}}
@media print{
  aside,.topbar,.deck,.voice-note,.rounds,.pager,.nextrow,.actions,textarea,.field{display:none!important}
  .shell{display:block}.panel{border:0;padding:0}
}
</style>
</head>
<body>
<div class="shell">
  <aside id="sidebar" aria-label="Scripts">
    <div class="brand">
      <div class="crest" aria-hidden="true">UL</div>
      <div><h1>University Listening Lab</h1><p>Ron Taylor Masterclass</p></div>
    </div>
    <div class="search">
      <label for="q" style="position:absolute;left:-9999px">Search scripts</label>
      <input id="q" type="search" placeholder="Search titles and subjects">
    </div>
    <div class="progress-mini" id="progMini"></div>
    <nav id="nav"></nav>
  </aside>
  <div class="scrim" id="scrim"></div>
  <main>
    <div class="topbar"><button id="menuBtn" aria-controls="sidebar" aria-expanded="false">Scripts</button><strong>University Listening Lab</strong></div>
    <div class="wrap" id="view"></div>
  </main>
</div>
<script>
const BOOK = [{"part":1,"title":"University Fundamentals","scripts":[{"num":1,"title":"What University Work Really Looks Like","lines":[["P","Before we begin the course, I want to talk about something that sometimes surprises students, particularly students who have studied in other countries. The number of hours you spend in this classroom is only part of your university work. For this course, we meet for three hours each week. That doesn't mean that three hours is the total amount of time you should expect to spend on the course. You'll also have readings, assignments, research, preparation for class discussions, and studying for exams. Some weeks will be lighter, while other weeks will require considerably more time. For example, this week I'm asking you to read two chapters before our next class. Next week, you won't have the same reading assignment, but you'll be working on your first paper. So I wouldn't think of university work as simply \"homework.\" You're gradually becoming responsible for managing your own academic workload. You may have several courses at the same time, and each professor will have different expectations. One course might have weekly readings. Another might have a large research paper. A third might have several smaller assignments. I don't expect you to work on every course every day, but I do expect you to look ahead. If you know that a paper is due in three weeks, don't assume that you have three weeks before you need to start thinking about it. You should also pay attention to the syllabus. The syllabus tells you what is expected, when major assignments are due, and how your final grade will be calculated. If you're working while studying, you'll need to manage those responsibilities together. That's part of university life. And if you realize that you're falling behind, don't simply disappear. Come and talk to me. The earlier you identify a problem, the more options you usually have."]],"words":302,"kind":"lecture"},{"num":2,"title":"Understanding the Syllabus","lines":[["P","I'd like everyone to take out the syllabus I gave you on the first day. I know some of you may have looked at it already, but I want to show you how I expect you to use it. The syllabus isn't simply a document that tells you when the final exam takes place. It's your roadmap for the course. You'll find the weekly schedule here, along with the required readings, assignment deadlines, grading breakdown, and course policies. Notice that the first paper is worth twenty percent of your final grade, while the final project is worth thirty percent. That means you should probably give those assignments more attention than a small weekly exercise worth two percent. You'll also notice that participation is worth ten percent. I'll explain exactly what I mean by participation in our next class, because it doesn't simply mean being physically present. Now, one thing I strongly recommend is that you check the syllabus before emailing me a question about a deadline or assignment. I'm not saying you shouldn't ask questions. Please ask them. But if the answer is already clearly stated in the syllabus, I may simply direct you back to that section. Also notice that some dates are marked as tentative. That means they may change. If I change an important deadline, I'll announce it in class and update the online course system. One final point: the syllabus describes the general expectations, but it can't answer every possible question. If you're unsure about something that isn't covered there, ask. The purpose of the syllabus is to help you manage the course, not to prevent you from talking to me."]],"words":275,"kind":"lecture"},{"num":3,"title":"Understanding an Assignment","lines":[["P","Let's look at your first assignment. The question is: \"Analyze the factors that contributed to the company's decline.\" I'd like you to pay particular attention to the word analyze. I'm not asking you simply to describe what happened. If you describe the company's history, explain when sales declined, and tell me what happened afterward, you may have provided accurate information without actually answering the question. Analysis requires you to examine relationships. Why did sales decline? Which factors were most significant? How did those factors interact? And what evidence supports your interpretation? You'll notice that I haven't given you a required answer. I'm not looking for everyone to reach exactly the same conclusion. I am looking for a conclusion that is supported by evidence and reasoning. You should also pay attention to the wording of assignment questions in your other courses. \"Describe,\" \"explain,\" \"compare,\" \"analyze,\" and \"evaluate\" don't necessarily mean the same thing. If an assignment says \"compare two theories,\" for example, I don't want two separate summaries with no connection between them. I want you to identify meaningful similarities and differences. If the question says \"evaluate,\" you should normally go one step further and make a judgment based on evidence or criteria. Before you start writing, I recommend that you underline the important words in the question. Then ask yourself: What exactly am I being asked to do? A surprising number of weak assignments contain plenty of information but don't actually answer the question. Your first job is not to start writing. Your first job is to understand the assignment."]],"words":260,"kind":"lecture"},{"num":4,"title":"Asking a Professor for Clarification","lines":[["S","Professor, could I ask you something about the research assignment?"],["P","Of course."],["S","I'm not sure I understand the requirement about sources. You said we need at least five academic sources. Does that mean five journal articles?"],["P","Not necessarily. Academic books and appropriate scholarly publications can also count. What I don't want is for you to rely mainly on general websites."],["S","Okay. I found a government report that seems very relevant. Would that count?"],["P","Yes, depending on the subject of your paper. In some cases, a government report can be a very useful source."],["S","So I could use five sources, including the government report?"],["P","You could, but remember that the quality and relevance of the sources matter more than simply reaching the number five."],["S","That makes sense. I had another question. When you say we should \"discuss the implications,\" I'm not sure what you mean by implications."],["P","Good question. In this assignment, I'm asking you to consider what your findings mean beyond the immediate results."],["S","Could you give me an example?"],["P","Certainly. Suppose your research shows that students who commute longer distances report less time for extracurricular activities. An implication might be that transportation and housing policies can affect students' ability to participate in university life."],["S","Okay. So I'm not just reporting the result. I'm explaining why the result matters."],["P","Exactly. And that's the kind of question I want you to ask when an instruction isn't clear. Don't simply say, \"I don't understand the assignment.\" Tell me which part is unclear. That makes it much easier for me to help you."]],"words":260,"kind":"dialogue"},{"num":5,"title":"Managing Several Courses at Once","lines":[["P","One thing you're going to discover fairly quickly is that university assignments don't always arrive one at a time. You may have a paper due in one course, a presentation in another, and an exam coming up in a third. That's normal. What becomes a problem is waiting until each professor reminds you. You should be keeping track of your deadlines yourself. I recommend putting every major deadline from every course into one calendar. Then look ahead. If you have three major assignments due during the same week, you should know that several weeks in advance. That doesn't mean you have to finish everything immediately. It means you can distribute the work. For example, you might spend one afternoon finding sources for a research paper, another evening preparing a presentation, and the weekend reviewing material for an exam. Don't make the mistake of thinking, \"The paper isn't due for another two weeks, so I have plenty of time.\" Two weeks can disappear very quickly when you have work from four other courses. And if you're working while studying, your schedule becomes even more complicated. That doesn't mean your professors expect you to have unlimited time. It does mean that you're responsible for managing the time you do have. If you realize that you have a serious scheduling problem, deal with it early. Don't wait until midnight on the night before an assignment is due and send three professors the same message saying that you need an extension. Planning ahead is one of the most important academic skills you can develop."]],"words":260,"kind":"lecture"},{"num":6,"title":"Understanding Participation","lines":[["P","I'd like to clarify what I mean by participation because students sometimes interpret this differently. Participation does not simply mean attending class. Obviously, you need to be here. But if you attend every class, say nothing, ask no questions, and never contribute to discussions, I wouldn't consider that active participation. Participation can take several forms. You might answer a question. You might ask a question. You might respond to another student's idea. You might point out a problem with an argument. You might bring something from the reading into the discussion. You don't have to speak constantly. In fact, talking for ten minutes every class isn't necessarily good participation. I'm more interested in whether your contributions are relevant and thoughtful. And you are allowed to disagree with me. If you disagree with something I've said, that's fine. You could say, \"I'm not sure I agree with that interpretation because...\" Or, \"Could there be another way of looking at this?\" That's perfectly appropriate in a university classroom. You don't need to become aggressive to demonstrate that you have an independent opinion. You also don't need to wait until you're completely certain before asking a question. Sometimes the best questions begin with, \"I'm not sure I understand why...\" Remember that other students may have the same question. So participation isn't a competition to see who can speak the most. It's part of the learning process."]],"words":233,"kind":"lecture"},{"num":7,"title":"Asking for an Extension","lines":[["S","Professor, do you have a minute?"],["P","Sure. What's up?"],["S","I'm working on the research paper that's due next Friday, and I'm concerned that I won't be able to finish it properly by the deadline. Would it be possible to get an extension?"],["P","What's causing the problem?"],["S","I have two other major assignments due that week, and I'm also working several shifts at my job."],["P","I understand. How much additional time are you asking for?"],["S","Would Monday be possible?"],["P","Let me look at the schedule. Yes, I can give you until Monday, but I need you to understand that extensions aren't automatic."],["S","Of course."],["P","And in the future, I'd encourage you to raise the issue earlier. You've contacted me four days before the deadline, which is reasonable. But if you know two weeks in advance that there's going to be a problem, that's the better time to talk to me."],["S","Understood."],["P","Also, don't assume that having other assignments means you're automatically entitled to an extension. University students often have several deadlines at once."],["S","Right."],["P","I'm granting this extension because you've contacted me before the deadline and you've explained the situation clearly."],["S","Thank you. I appreciate it."],["P","You're welcome. And one more thing: use the extra time productively. I don't want you simply starting the paper on Friday because you've been given until Monday."],["S","Fair enough."],["P","Good. Then I'll update the deadline on the course system."]],"words":234,"kind":"dialogue"},{"num":8,"title":"What Happens When You Miss a Deadline?","lines":[["P","Let's talk about late assignments. The deadline for your first paper is Friday at 11:59 p.m. If you submit it after that time, the late-submission policy applies. For this course, assignments submitted within twenty-four hours of the deadline receive a five-percent deduction. After twenty-four hours, the deduction increases. However, there are circumstances in which the normal policy may not apply. If you have a serious problem, contact me as soon as possible. What I don't recommend is submitting the assignment three days late without saying anything and then explaining afterward that you were having difficulties. Communication matters. You also need to understand the difference between asking for an extension and explaining a missed deadline. If you know in advance that you have a problem, ask before the deadline. If something unexpected happens, contact me as soon as reasonably possible afterward. And please don't send a message that simply says, \"I couldn't finish my assignment. Can I have more time?\" Tell me what happened and what you're asking for. For example: \"I'm dealing with an unexpected family situation and don't think I can meet Friday's deadline. Would it be possible to submit the assignment on Monday?\" That's much clearer. Now, I'm not saying that an explanation guarantees an extension. It doesn't. You should assume that deadlines matter. But you should also understand that professors are people, and professional communication is important. The worst approach is usually to disappear and hope the problem will somehow resolve itself."]],"words":245,"kind":"lecture"},{"num":9,"title":"Understanding Your Grade","lines":[["P","I want to spend a few minutes talking about grades. You will receive a numerical grade for many of your assignments, but the number by itself doesn't tell you everything. Suppose you receive 76 percent on a paper. That doesn't automatically mean the paper was poor. It means the work met some criteria more successfully than others. At university, grading standards may also be different from what you're accustomed to. You shouldn't assume that a paper receiving 90 percent is simply a slightly better version of a paper receiving 75 percent. The difference may involve the quality of the argument, the depth of analysis, the use of evidence, the organization of the paper, or how effectively the student responds to the assignment. That's why I want you to read the feedback along with the grade. If you receive 76 percent and the comments say, \"Strong evidence, but the analysis needs further development,\" that's useful information. It tells you what to work on next. Another important point is that effort and grades aren't necessarily the same thing. You may spend twenty hours on a paper and receive 72 percent. Another student may spend fewer hours and receive 82 percent. That doesn't necessarily mean the professor thinks the second student worked harder. The grade reflects the submitted work against the assessment criteria. So don't look only at the number. Ask yourself: What did I do well? What did I not do well? And what can I change on the next assignment? That's how grades become useful."]],"words":254,"kind":"lecture"},{"num":10,"title":"Why Didn't I Get a Higher Grade?","lines":[["S","Professor, could I ask you about my paper?"],["P","Certainly."],["S","I received 72 percent, and I was surprised. I thought I'd done quite well."],["P","I'm happy to talk about it. What part of the feedback surprised you?"],["S","You wrote that my paper needed more analysis. I'm not sure what you mean."],["P","Your research was actually quite strong. You found relevant sources and explained them accurately. The problem is that much of the paper tells me what the researchers said. I wanted you to use their findings to develop your own argument."],["S","So I summarized too much?"],["P","Yes. That's the main issue."],["S","But if the information is important, shouldn't I explain it?"],["P","Absolutely. Some explanation is necessary. But after presenting the evidence, you need to ask what it means for your argument. For example, you wrote three paragraphs explaining Researcher A's findings. Then you did the same with Researcher B. What I wanted was more comparison. What does Researcher B's evidence add? Does it support Researcher A? Does it challenge that interpretation? Are there limitations?"],["S","I see."],["P","Your English wasn't the reason for the grade."],["S","Really?"],["P","Your English was clear enough for the purpose of the assignment. The main issue was analytical depth."],["S","That's helpful. Could I come to your office hours and talk about how to improve the next paper?"],["P","Certainly. Bring your current paper with you, and we'll look at one section together."]],"words":233,"kind":"dialogue"},{"num":11,"title":"Understanding Written Feedback","lines":[["P","Before you submit your next paper, I'd like you to become more comfortable interpreting written feedback. Professors don't always write a long explanation beside every paragraph. You might see a comment such as \"develop this.\" That means I've identified an idea that needs further explanation or support. If I write \"be more specific,\" I'm telling you that your statement is too general. If I write \"evidence?\" I'm asking you to support the claim with evidence. And if I write \"interesting point,\" don't automatically assume that means I agree with you. It may simply mean that you've raised an idea that deserves further consideration. You should also pay attention to patterns in the feedback. If I mention your thesis once, that may be a small issue. If I repeatedly say that your argument isn't clear, that's probably something you should work on. The same applies to positive feedback. If I write \"strong use of evidence\" several times, that's something you should continue doing. One mistake students sometimes make is treating feedback as a judgment of themselves. It isn't. A comment saying \"your conclusion needs more development\" is about the conclusion of the paper. It's not saying that you're a weak student. Try to treat feedback as information. The purpose is to help you understand what you're already doing successfully and where your academic work can improve. And if you don't understand a comment, ask. You can bring the paper to office hours and say, \"I'm not sure what you mean by this comment. Could you explain it?\" That's a perfectly reasonable question."]],"words":261,"kind":"lecture"},{"num":12,"title":"Understanding a Grading Rubric","lines":[["P","Let's look at the rubric for your upcoming presentation. A rubric is more than a form I use after you've finished the assignment. You should use it before you start. You'll see that your argument is worth thirty percent, evidence is worth twenty-five percent, organization is worth twenty percent, delivery is worth fifteen percent, and visual material is worth ten percent. Notice something important here. The visual component is only ten percent. So spending three hours designing beautiful slides won't compensate for a weak argument. The largest portion of the grade is based on the quality of your argument and your evidence. You should also look carefully at the descriptions beside each category. Under \"Argument,\" the strongest level says that the presentation develops a clear, convincing argument supported by relevant evidence. A lower level describes an argument that is present but not fully developed. Those distinctions matter. If you're aiming for a strong grade, don't simply ask, \"What do I need to include?\" Ask, \"What would make this stronger?\" That's a different question. And remember that the rubric doesn't mean you should write to the categories separately. A strong presentation usually has connections among the categories. A clear argument makes it easier to choose relevant evidence. Good organization makes the argument easier for the audience to follow. So use the rubric as a planning tool. Don't wait until you receive your grade to discover what the professor was looking for."]],"words":240,"kind":"lecture"},{"num":13,"title":"Asking About a Grade","lines":[["S","Professor, could I talk to you about my grade on the presentation?"],["P","Sure."],["S","I received 78 percent. I'd like to understand where I lost marks."],["P","That's a good question. Did you look at the rubric?"],["S","Yes. I noticed that I lost marks for organization and analysis."],["P","Right."],["S","Could you explain what you thought was missing?"],["P","Your individual sections were quite good, but the presentation didn't feel like one argument. It felt more like four people presenting four separate pieces of research."],["S","I understand."],["P","The group had good information. The problem was the connection between the information."],["S","So we should have had one central argument?"],["P","Exactly."],["S","If we had done that, would the grade have been higher?"],["P","I can't say exactly. Grades aren't calculated that way. But it would have addressed one of the main weaknesses identified in the rubric."],["S","That makes sense."],["P","And I appreciate the way you're asking about the grade. You're asking me to explain the assessment rather than simply asking me to change the number."],["S","I want to understand what I should do differently next time."],["P","That's the most useful reason to discuss a grade. If, after reviewing the feedback, you believe I've made an error in applying the rubric, you can raise that as well. But start with understanding the assessment."]],"words":215,"kind":"dialogue"},{"num":14,"title":"Regrading and Grade Appeals","lines":[["P","There is one more issue concerning grades that you should understand. Sometimes a student believes a grade is unfair. If that happens, the first step is normally to review the feedback and the grading criteria carefully. Don't begin with, \"I deserve a higher grade.\" Instead, identify the specific issue. For example, you might say, \"I noticed that the rubric awards twenty points for evidence, and I'm not sure why I received twelve. Could we review that section?\" That's a much more useful conversation. You should also understand that a request for a regrade doesn't necessarily result in a higher grade. A review means the work is assessed according to the relevant criteria. The result could be higher, lower, or unchanged, depending on the university's policy. For that reason, you should only request a formal review when you have a reasonable basis for doing so. Another important point: don't compare your grade with your friend's grade and assume that something went wrong. Your friend's paper may have been assessed differently because the work itself was different. If you believe there has been a genuine problem, follow the university's formal process. The important principle is this: You are allowed to question an academic decision respectfully. At the same time, you are expected to support your concern with evidence. That is very different from simply asking for more marks."]],"words":226,"kind":"lecture"},{"num":15,"title":"Office Hours: How to Use Them","lines":[["S","Professor, are your office hours just for students who are having problems with the course?"],["P","No. That's a common misunderstanding. Office hours are a time when students can come and talk with me about the course. You might have a question about an assignment, want to discuss an idea for a research paper, or want clarification about feedback. You don't need to be failing the course."],["S","So I could come before I start my paper?"],["P","Absolutely. In fact, that's often a good time to come. If you have a research question and you're not sure whether it's focused enough, bring it to me. We can discuss it before you've spent ten hours researching the wrong question."],["S","Should I make an appointment?"],["P","For my scheduled office hours, you can simply come by. If you need a longer meeting, send me an email first."],["S","What should I bring?"],["P","Whatever is relevant. Bring your assignment, your notes, your research question, or your draft. But don't come in and say, \"I don't understand anything.\" Try to identify the specific problem."],["S","So instead of saying, \"I need help with my paper,\" I could say, \"I'm not sure whether my research question is too broad\"?"],["P","Exactly. That gives us something concrete to work on. Office hours are one of the resources you're paying for as a university student. Use them."]],"words":224,"kind":"dialogue"},{"num":16,"title":"When You Feel Overloaded","lines":[["S","Professor, I'm having a hard time keeping up with everything."],["P","Tell me what's happening."],["S","I have a paper due in your class, an exam next week, another presentation, and I'm working twenty hours a week."],["P","Okay. Let's separate the different problems. Which assignment is due first?"],["S","The paper."],["P","And how much work have you done on it?"],["S","I've chosen a topic, but I haven't really started the research."],["P","When did you choose the topic?"],["S","Yesterday."],["P","All right. So part of the problem may be workload, but part of it may also be timing."],["S","I know. I probably should have started earlier."],["P","That's something you can change. Let's look at the next two weeks rather than trying to solve the entire semester today. Write down every deadline. Now estimate how much time each task actually requires. Don't write \"study.\" Write something specific, such as \"review chapters three and four\" or \"find three academic sources.\""],["S","That already makes it seem more manageable."],["P","Good. And if, after doing that, you discover that you genuinely have a problem you can't solve through scheduling, come back and talk to me. But don't assume that every busy week requires an extension. University involves periods of heavy workload. Learning how to manage those periods is part of becoming an independent student."]],"words":214,"kind":"dialogue"},{"num":17,"title":"Group Work and Unequal Contributions","lines":[["S","Professor, could I talk to you about our group project?"],["P","Sure."],["S","One of our group members isn't doing much work. The rest of us have completed most of the project."],["P","Have you spoken directly to that student?"],["S","Not really. We didn't want to create a conflict."],["P","I understand, but avoiding the conversation usually doesn't solve the problem. Have you clearly divided the responsibilities?"],["S","We have, but the student missed two meetings and hasn't completed the research they agreed to do."],["P","Then I'd suggest you address it directly. You could say, \"We noticed that your section hasn't been completed yet. Is there a problem with the assignment or with the timeline?\" Give the person an opportunity to explain."],["S","And if nothing changes?"],["P","Document what the group has agreed to do and communicate the problem to me early. Don't wait until the night before the presentation."],["S","Should we just do the missing work ourselves?"],["P","If you do that without communicating the problem, you may create another problem. The purpose of group work isn't simply to produce a finished assignment. You're also being assessed on your ability to collaborate."],["S","What if we disagree about how to do the project?"],["P","That's normal. Disagreement isn't necessarily a problem. The question is whether you can discuss the disagreement professionally and reach a decision."]],"words":217,"kind":"dialogue"},{"num":18,"title":"What Professors Expect You to Do Independently","lines":[["P","There's one final point I'd like to make before we move into the academic skills section. At university, professors aren't necessarily going to tell you exactly what to do at every stage. Sometimes students find this frustrating. They'll ask, \"Which topic should I choose?\" And I'll respond, \"Which topic interests you?\" They'll ask, \"Which source should I use?\" And I might say, \"What have you found so far?\" That isn't because I don't want to help. It's because part of university education is learning to make academic decisions yourself. I'll give you the assignment requirements. I'll explain the assessment criteria. I'll answer questions. I'll give you feedback. But I won't necessarily make every decision for you. For example, if an assignment says, \"Choose an appropriate academic source,\" I'm not going to give you a list of ten sources and tell you which one to use. I expect you to evaluate them. If you're uncertain, you can ask me what factors you should consider. That's different from asking me to make the decision for you. The same principle applies to writing. I can tell you that your argument isn't clear. I can explain why. But you may need to decide how to restructure the argument. This can feel very different from an educational system in which the teacher provides much more direction. The goal isn't to leave you on your own. The goal is to gradually make you more independent. By the end of your degree, I shouldn't have to tell you every step. You should be able to look at a problem, identify what you need to know, find appropriate information, ask useful questions, make a decision, and explain why you made it. That's what university is preparing you to do."]],"words":291,"kind":"lecture"}]},{"part":2,"title":"Academic Skills & Communication","scripts":[{"num":19,"title":"Choosing a Research Question","lines":[["P","For your first research assignment, I'd like you to begin with a question rather than a topic. There's an important difference. \"Artificial intelligence\" is a topic. \"Social media\" is a topic. \"Immigration\" is a topic. None of those is a research question. A research question gives your investigation a direction. For example, instead of researching \"artificial intelligence,\" you might ask, \"How is generative artificial intelligence changing the way university students approach academic writing?\" That's much more focused. But even that question might be too broad for a short paper. You might narrow it further by looking at first-year students, a particular type of writing, or a particular university setting. As you're developing your question, ask yourself three things. First, can I actually research this? Second, is there enough reliable information available? And third, can I reasonably address the question within the length of this assignment? You may discover that your original question changes once you start reading. That's completely acceptable. In fact, I expect it to happen. Research isn't always a straight line. You begin with an idea, find some information, realize that the question is too broad, narrow it, discover something unexpected, and then adjust your approach. Don't think of changing your research question as failure. Think of it as part of the research process. What I don't want is for you to spend two weeks collecting information before realizing that you don't actually have a question. So before you start gathering sources, send me your proposed question. I'll give you some feedback."]],"words":254,"kind":"lecture"},{"num":20,"title":"Summary vs. Analysis","lines":[["P","I'd like to clarify something that comes up frequently in student papers: the difference between summary and analysis. Summary tells the reader what someone else has said. Analysis examines what that information means. Suppose you're writing about a study on university students and sleep. You might write, \"The researchers found that students who slept fewer than six hours reported higher levels of stress.\" That's a summary of the finding. It's useful information. But now ask yourself: What does that finding tell us? How strong was the study? Who participated? How was stress measured? Did the researchers establish that lack of sleep caused the stress? Could there be another explanation? That's where analysis begins. I'm not suggesting that you eliminate summary completely. You need to explain important evidence before you can analyze it. The problem occurs when a paper becomes a series of summaries. You tell me what Researcher A said. Then what Researcher B said. Then what Researcher C said. At the end, I know what three researchers said, but I still don't know what you think the evidence demonstrates. Your argument should connect the evidence. Perhaps Researcher A and Researcher B reached similar conclusions, while Researcher C found something different. Why? Was the population different? Was the methodology different? Were they measuring different things? That's analysis. When you revise your paper, don't simply ask, \"Have I included enough information?\" Ask, \"What am I doing with this information?\" That question will improve your academic writing considerably."]],"words":246,"kind":"lecture"},{"num":21,"title":"Building an Argument and Thesis","lines":[["P","Let's talk about the central argument of your paper. Many students understand that they need a thesis statement, but they sometimes treat the thesis as a sentence they write because the assignment requires one. That's not really the point. Your thesis is the central claim that your paper is going to develop and support. Imagine you're writing about remote work. You could write, \"Remote work has become increasingly common.\" That's a statement. It's not necessarily an argument. You might instead argue that remote work can improve employee flexibility but may create challenges for collaboration among certain types of teams. Now you have something that can be examined. You can provide evidence supporting the benefits. You can examine the challenges. You can consider exceptions. And you can reach a conclusion. Your body paragraphs should contribute to that overall argument. If you have a paragraph that contains interesting information but doesn't help answer your research question, ask yourself whether it belongs. And don't worry if your thesis changes during the research process. It often should. You may begin believing that one explanation is most important, then discover evidence that changes your interpretation. That's not a weakness. It's one of the reasons we do research. You should also distinguish between a thesis and a topic. \"Climate change\" is a topic. \"Government policy\" is a topic. A thesis makes a claim about the subject that you can support with evidence. So before you start writing your introduction, finish this sentence for yourself: \"My argument is that...\" If you can't complete that sentence clearly, you're probably not ready to write the paper."]],"words":267,"kind":"lecture"},{"num":22,"title":"Using Sources, Paraphrasing, and Academic Integrity","lines":[["P","Let's discuss how to use information from other writers. You have three basic options. You can quote someone directly. You can paraphrase their idea in your own words. Or you can summarize their overall argument. Whichever approach you use, you need to acknowledge the source. But there's an important point about paraphrasing. Changing a few words in the original sentence isn't enough. If the structure of your sentence remains almost identical to the source, you're still relying too heavily on the original wording. A genuine paraphrase requires you to understand the idea first and then express it in your own language. Here's another problem. Students sometimes think that if they put a citation at the end of a paragraph, everything in the paragraph automatically becomes their own work. That's not how it works. Your reader should be able to distinguish between your analysis and information you've taken from a source. You also need to keep careful notes while researching. If you copy a sentence into your notes, mark it clearly as a quotation. Otherwise, two days later you may forget that the words weren't yours. Academic integrity isn't simply about avoiding punishment. It's about being honest about where your information and ideas come from. And don't assume that academic integrity only applies to written assignments. It applies to presentations, group projects, data, images, and other academic work as well. If you're unsure whether something needs to be cited, ask. It's much better to ask before submitting the assignment than to discover afterward that you misunderstood the requirement."]],"words":257,"kind":"lecture"},{"num":23,"title":"Evaluating Sources","lines":[["P","You've now gathered several sources for your paper. Before you start using them, I want you to evaluate them. Finding information isn't the same thing as finding good information. Start by asking who produced the source. Is it a university researcher? A government department? A professional organization? A company? An individual blogger? Those sources may all contain useful information, but they don't necessarily have the same purpose or level of authority. Next, consider when the information was published. A ten-year-old source isn't automatically useless. In some subjects, older research remains important. But in a rapidly changing field, the date may matter considerably. You should also ask what evidence the source provides. Does it cite research? Does it explain its methodology? Does it distinguish evidence from opinion? And think about the author's possible interests. Suppose you're reading a report produced by a company about the effectiveness of its own product. That doesn't automatically mean the report is false. But you should be aware of the potential conflict of interest. The same principle applies to sources that strongly support a position you already agree with. Don't evaluate a source only by whether you like its conclusion. Evaluate how the conclusion was reached. For your assignment, I want you to include a short source-evaluation section. Choose two sources and explain why you consider them useful and what limitations they have. A source doesn't have to be perfect to be useful. What matters is that you understand what it can—and cannot—tell you."]],"words":248,"kind":"lecture"},{"num":24,"title":"Understanding Academic Vocabulary","lines":[["P","There's another reason university assignments can be difficult for international students. Sometimes you understand every individual word, but you don't understand what the professor is asking you to do. That's often because academic vocabulary has a more specific meaning. For example, if I ask you to compare two theories, I'm asking you to identify meaningful similarities and differences. If I ask you to contrast them, I'm emphasizing the differences. If I ask you to analyze something, I want you to examine its components and relationships rather than simply describe it. If I ask you to evaluate an argument, I want you to assess its strengths and weaknesses using appropriate evidence or criteria. And if I ask you to discuss something, I usually expect a broader examination of the issue rather than a simple definition. You should also listen carefully to the language professors use in class. If I say, \"You may want to consider looking at this study,\" I'm not necessarily giving you an optional suggestion that you can safely ignore. I may be telling you that I think the study would be useful. Similarly, when a professor says, \"I'd like you to revisit this section,\" that is normally an instruction. The wording may sound softer than \"You need to rewrite this section,\" but you should still pay attention. Canadian academic communication often uses indirect language to remain polite. That doesn't mean the message is unimportant. As you listen to your professors, don't focus only on individual words. Listen for the purpose behind the sentence. Ask yourself: Is this a suggestion, a requirement, a warning, or feedback? That will help you understand what you're actually being asked to do."]],"words":279,"kind":"lecture"},{"num":25,"title":"Writing an Introduction","lines":[["P","Let's look at the introduction to your research paper. A common mistake is to begin with a very broad statement. For example: \"Since the beginning of human history, people have communicated with one another.\" That's technically true, but it doesn't help your reader understand what your paper is about. Your introduction should move efficiently toward your specific question and argument. You might begin by establishing the issue. Then provide enough context for the reader to understand why the issue matters. After that, introduce your research question or central problem. And by the end of the introduction, the reader should have a clear idea of what your paper is going to argue. You don't need to tell the reader everything you're going to say. In fact, I'd recommend that you avoid writing a long list of everything that appears in the paper. Instead, establish the direction of the argument. Think of the introduction as answering three questions: What is the issue? Why does it matter? What am I going to argue or investigate? If your introduction takes up two pages of a ten-page paper, I'd probably suggest shortening it. Your reader shouldn't have to wait until page three to discover your actual question. And remember that you don't necessarily have to write the introduction first. Some students find it easier to write the body of the paper and return to the introduction afterward. That's perfectly reasonable. The introduction should accurately represent the paper you've actually written."]],"words":245,"kind":"lecture"},{"num":26,"title":"Writing a Strong Conclusion","lines":[["P","Now let's look at the other end of the paper: the conclusion. A conclusion isn't simply the place where you stop writing. It should bring your argument together. One common approach is to repeat the thesis word for word. You don't need to do that. Instead, return to the central question and explain what your analysis has established. For example, if your paper asked whether remote work improves productivity, your conclusion shouldn't simply say, \"Remote work improves productivity.\" Your evidence may have shown something more complicated. Perhaps productivity increased for some types of work but not others. Perhaps the effect depended on management practices. That gives you a more useful conclusion. You can also discuss limitations. Maybe the studies you examined focused mainly on large companies, so it's difficult to generalize the findings to small businesses. That's not necessarily a weakness in your paper. Recognizing a limitation demonstrates that you understand the boundaries of your evidence. You can also identify questions that remain unanswered. But avoid ending every paper with, \"More research is needed.\" Tell me what research would actually be useful. What question remains unanswered? What population should be studied? What information is missing? And don't introduce a completely new major argument in the final paragraph. If an idea is important enough to change your conclusion, it probably belongs earlier in the paper. A strong conclusion doesn't simply repeat the paper. It shows the reader what the paper means."]],"words":240,"kind":"lecture"},{"num":27,"title":"Correlation vs. Causation","lines":[["P","I'd like to return to a distinction that you'll encounter in many different university courses: correlation versus causation. Suppose a study finds that students who spend more time exercising report lower levels of stress. We can say that the two variables are associated. But can we say that exercise causes lower stress? Not necessarily. Perhaps exercise reduces stress. That's one possible explanation. But perhaps students who are less stressed have more time to exercise. Or perhaps another factor influences both. Maybe students with lighter course loads have more time to exercise and also experience less academic pressure. So when you read research, don't stop at the statement that two variables are related. Ask what other explanations are possible. For your assignment, I'd like you to find a study that reports a relationship between two variables. Then explain what the researchers can reasonably conclude. After that, explain what they cannot conclude. You don't need to criticize the researchers for failing to establish causation if their research design wasn't intended to do that. Different research questions require different methods. The important thing is that the conclusion matches the evidence. You'll encounter this distinction outside psychology and science as well. You might read that students who attend more classes receive higher grades. That doesn't automatically prove that attendance causes higher grades. Students who are more organized might both attend more classes and study more effectively. So whenever you hear the phrase, \"Research shows that...,\" pause for a moment. Ask yourself what the research actually shows. That's a habit I want you to develop throughout your university education."]],"words":264,"kind":"lecture"},{"num":28,"title":"Using Evidence Correctly","lines":[["P","Let's talk about evidence. Having ten sources in a paper doesn't necessarily mean that you have a strong argument. What matters is how you use those sources. Imagine you make the statement, \"Remote work improves employee productivity.\" That's a significant claim. You'll need evidence. But simply placing a citation after the sentence isn't enough. You need to explain what the evidence demonstrates. Perhaps a particular study found increased productivity among employees working remotely. Tell the reader what the study examined. Then explain how that finding supports your argument. You should also consider whether the evidence actually applies to your claim. If the study involved fifty software engineers in one company, you should be cautious about using it to make a statement about every worker in every industry. This is where academic writing requires precision. Instead of writing, \"Remote work makes people more productive,\" you might write, \"Some studies have found increased productivity among certain groups of remote workers.\" That statement is narrower, but it may be much more defensible. You should also distinguish between evidence and example. An example can make an argument easier to understand. It doesn't necessarily prove the argument. Finally, don't hide evidence that creates a problem for your position. If a credible study reaches a different conclusion, address it. You might explain why the studies differ. That can actually strengthen your argument. Strong academic writing isn't about collecting evidence that agrees with you. It's about understanding the evidence well enough to make a defensible claim."]],"words":249,"kind":"lecture"},{"num":29,"title":"Preparing a University Presentation","lines":[["P","Your next assignment is a ten-minute academic presentation. Ten minutes may sound like a long time, but it goes surprisingly quickly. The first thing I want you to do is decide what your audience needs to understand. Don't try to include everything you discovered during your research. Your presentation needs a central message. Begin by establishing the question or problem. Then present the evidence that helps answer that question. Finally, explain what you want the audience to take away from the presentation. Your slides should support your explanation rather than replace it. If a slide contains three hundred words, you're probably asking the audience to read while you're speaking. That's difficult to do. Use concise points, diagrams, charts, or other visual material where appropriate. You should also rehearse. And don't simply read the presentation silently. Say it aloud. You'll discover that some sentences are much harder to say than they looked on the page. Time yourself. If your presentation takes fourteen minutes when the limit is ten, don't assume you'll speak faster on the day. You'll probably speak more slowly because you'll be nervous. I'd also like you to prepare for questions. You don't have to know the answer to every possible question. If someone asks something you don't know, you can say, \"I'm not sure. That's something we didn't investigate.\" That's much better than inventing an answer. A good presentation isn't one in which you appear to know everything. It's one in which you communicate what you know clearly and handle questions intelligently."]],"words":254,"kind":"lecture"},{"num":30,"title":"Responding to Questions After a Presentation","lines":[["P","After your presentations, we'll have a question period. I want you to understand that questions aren't necessarily criticism. Someone may ask, \"Why did you choose this method?\" That doesn't mean they think your method was wrong. They may simply want to understand your reasoning. Before answering, make sure you understand the question. If you're unsure, you can say, \"Could you clarify what you mean?\" That's completely acceptable. You can also take a moment to think. You don't have to answer immediately. If the question challenges your argument, don't become defensive. For example, someone might say, \"Your presentation suggests that this policy was successful, but didn't you find evidence that it created problems as well?\" You could respond: \"Yes. That's an important limitation. Our evidence suggests that the policy produced some benefits, but there were also negative effects in certain situations.\" You haven't weakened your presentation by acknowledging a limitation. You've demonstrated that you understand the complexity of the issue. Sometimes a question will take you beyond what you researched. You can say, \"That's an interesting question. We didn't examine that variable in our study, so I wouldn't want to speculate.\" That's a strong academic response. And remember that you can respectfully disagree. You might say, \"I see your point, but our interpretation was based on...\" The goal isn't to win the question period. The goal is to demonstrate that you understand your subject and can think about it from another perspective. By the end of this section, I want you to be comfortable with something that is fundamental to university education: You don't have to know everything. You need to know what you know, recognize what you don't know, and be able to explain your reasoning."]],"words":286,"kind":"lecture"}]},{"part":3,"title":"Business & Commerce","scripts":[{"num":31,"title":"Business Case Study","lines":[["P","For your next assignment, you'll be analyzing a business case study. The case describes a company that has been losing customers over the past two years. Your job is not simply to explain what happened. I want you to identify the most important problem facing the company and then develop a recommendation."],["S","So, are we supposed to discuss everything that went wrong?"],["P","No. That would probably produce a very long paper without a clear argument. The company has several problems, but I want you to decide which one is most important. You'll need to justify that decision."],["S","Could the main problem be declining customer satisfaction?"],["P","It could be, but you need to establish that from the evidence. You might find that customer satisfaction is declining because of poor service, higher prices, changes in the market, or stronger competition. Don't assume that the first explanation you notice is the correct one."],["S","What kind of recommendation are you looking for?"],["P","A realistic one. I don't want to read, \"The company should improve customer service.\" That sounds reasonable, but it doesn't tell management what to do. Explain what should change, why it should change, and what evidence supports your recommendation."],["S","Do we need to discuss the risks?"],["P","Yes. A strong business analysis recognizes trade-offs. Your recommendation may solve one problem while creating another. If there are uncertainties, acknowledge them."],["S","So the paper is really about making a decision based on evidence."],["P","Exactly. Think like an analyst, not a reporter. Your job is to interpret the information and make a defensible recommendation."]],"words":258,"kind":"dialogue"},{"num":32,"title":"Analytical Business Essay","lines":[["P","Your next assignment is an analytical essay. The topic is the effect of remote work on organizational productivity."],["S","Can we just explain the advantages and disadvantages?"],["P","You can discuss them, but that alone won't give you an analytical essay. I'm looking for an argument. For example, you might argue that remote work increases productivity under certain conditions but reduces it under others."],["S","So we need to take a position?"],["P","Yes, although \"position\" doesn't necessarily mean an extreme opinion. Your conclusion should be based on the evidence you find."],["S","How many sources do we need?"],["P","At least six academic or otherwise credible sources. More isn't necessarily better. Six relevant sources are more useful than fifteen sources that you barely understand."],["S","What if two sources disagree?"],["P","That's potentially very useful. Don't feel that you have to choose one and ignore the other. Ask why they reached different conclusions. Perhaps they studied different industries, different countries, or different groups of employees."],["S","Should each paragraph be about a different source?"],["P","No. That's a common mistake. Organize your paragraphs around ideas or parts of your argument, not around individual sources. You may use three sources in one paragraph if they help you develop the same point."],["S","And how much of the paper should be my own writing?"],["P","Most of it. Sources provide evidence. They shouldn't do the thinking for you. I want to see your interpretation of that evidence."],["S","So if I have a paragraph that summarizes several studies, I still need to explain what those studies mean for my argument."],["P","Exactly. That's where the analysis begins."]],"words":262,"kind":"dialogue"},{"num":33,"title":"Finance Group Presentation","lines":[["P","Your finance presentation will be done in groups of four. Your group will analyze the financial position of a publicly traded company and present your findings to the class."],["S","Does each person need to prepare a separate section?"],["P","Each person should have responsibility for part of the research, but the final presentation needs to sound like one presentation. I don't want four unrelated presentations placed next to each other."],["S","What should the overall structure be?"],["P","Start with your main question. Then give us the information we need to understand the company, followed by your financial analysis, your interpretation, and your conclusion."],["S","Can we just show the financial statements?"],["P","No. Numbers without interpretation don't tell us very much. If revenue increased by twelve percent, tell us why that matters. If debt increased, explain the possible implications."],["S","What if we're not sure why a number changed?"],["P","Then say that. You can propose a possible explanation, but make it clear that it's an interpretation rather than an established fact."],["S","How important are the slides?"],["P","Important, but don't put your entire presentation on the slides. Your audience should be listening to you, not reading paragraphs."],["S","And everyone has to speak?"],["P","Yes. Also, practice the transitions between speakers. If one person finishes by saying, \"That's all,\" and the next person suddenly starts talking about something unrelated, the presentation will feel disconnected."],["S","So we're being graded as a group?"],["P","There will be both group and individual components. I'll give you the rubric in advance. Read it before you prepare your presentation, not after."]],"words":257,"kind":"dialogue"},{"num":34,"title":"Accounting Research Assignment","lines":[["P","For your accounting research assignment, you'll investigate how companies communicate financial information to investors. I want you to compare a company's own reporting with independent analysis."],["S","Can we use the company's annual report as our main source?"],["P","Yes, and you should. But remember that an annual report represents the company's perspective. That doesn't make it unreliable. It means you need to understand what kind of source it is."],["S","So we should also look for outside sources?"],["P","Exactly. Look for reputable financial analysis, academic research, regulatory information, or other independent material."],["S","What if the company's explanation doesn't agree with an analyst's explanation?"],["P","That's where your paper becomes interesting. Don't simply say one source is right and the other is wrong. Examine the evidence and explain the difference."],["S","Are we expected to decide which one is correct?"],["P","Not necessarily. Sometimes the evidence isn't sufficient to make that decision. You can explain that the available evidence supports one interpretation more strongly while recognizing the uncertainty."],["S","What are you looking for in the conclusion?"],["P","I want you to answer the research question directly. Don't introduce a completely new issue in the final paragraph. Summarize what your analysis allows you to conclude and, if appropriate, identify what remains uncertain."],["S","Does grammar count heavily?"],["P","Your writing needs to be clear, but this is an accounting assignment, not an English-language course. I'm primarily evaluating the quality of your accounting analysis, your evidence, and your reasoning."]],"words":238,"kind":"dialogue"},{"num":35,"title":"Marketing Plan","lines":[["P","Your next project is to develop a marketing plan for a product or service of your choice. You may choose an existing company or create a hypothetical one."],["S","Can we choose any product?"],["P","Almost anything, provided you can identify a real customer problem or need. I don't want you to begin with, \"This is a great product.\" Begin with the customer."],["S","So we need to identify the target customer?"],["P","Yes. Be specific. \"Young people\" isn't a useful target market. You might define your audience by age, location, occupation, income, lifestyle, or another relevant characteristic."],["S","Do we need to conduct surveys?"],["P","You don't have to, but some form of primary research would strengthen the project. Even a small number of interviews can help you test your assumptions."],["S","What if people don't like our idea?"],["P","That's useful information. Don't change the results because they don't support your plan. Explain what you learned and whether you would modify the product or your marketing strategy."],["S","What about social media?"],["P","You can include it, but \"we'll advertise on Instagram\" isn't a marketing strategy by itself. Explain who you're trying to reach, what message you're communicating, and why that channel makes sense."],["S","And how important is creativity?"],["P","Creativity matters. But creativity isn't a substitute for analysis. A beautiful campaign with no evidence behind it will not receive a high mark."]],"words":224,"kind":"dialogue"},{"num":36,"title":"International Business Comparison","lines":[["P","For this assignment, you'll compare how a business operates in Canada with how the same type of business operates in another country."],["S","Can I compare Canada and Brazil?"],["P","Certainly. In fact, that could be a useful comparison if you can find appropriate evidence."],["S","Should I talk about cultural differences?"],["P","Yes, but be careful. Avoid statements such as, \"Canadians are like this and Brazilians are like that.\" Countries contain enormous differences within them."],["S","Then how should we discuss culture?"],["P","Use qualified language. You might say that research identifies di
